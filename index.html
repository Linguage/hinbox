:\"AI应用层没有死亡。通用写作、代码生成、图像生成等能力会被模型厂商持续吞掉，真正有空间的是深入行业流程、承担合规、治理、数据闭环和复杂执行的垂直系统。\",\"date\":\"2026-05-27\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Essays\"],\"tags\":[\"人工智能\",\"创业\",\"企业软件\",\"数据治理\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"essays/avoiding-death-on-the-yellow-brick-road.md\",\"coverImage\":\"$undefined\"},{\"id\":\"reports-encyclical-letter-of-his-holiness-leo-xiv-magnifica-humanitas-15-may-2026\",\"sender\":\"LEO PP. XIV\",\"author\":\"LEO PP. XIV\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"LEO PP. XIV\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"教宗良十四世通谕：伟大的常人：关于在人工智能时代捍卫人类位格\",\"snippet\":\"由天主创造的充满伟大尊严的人类，今天正面临一个关键的抉择：要么建造一座新的巴贝耳塔（Tower of Babel），要么建造一座天主与人类同在的城。每一代人都继承了塑造自己时代的任务，引导历史成为一个保护每个人尊严、促进正义并使友爱成为可能的地方。然而，每个时代也有创造一个更不人道、更不公正世界的危险。每当人类面临损害其真实身份的危险时，我们基督徒就会将目光投向降生成人的天主，因为我们知道，只有在圣言成了血肉的奥迹中，人类的奥迹才真正变得清晰。\",\"date\":\"2026-05-27\",\"isRead\":true,\"isStarred\":true,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Reports\"],\"tags\":[\"人工智能\",\"人类尊严\",\"科技伦理\",\"宗教\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"reports/encyclical-letter-of-his-holiness-leo-xiv-magnifica-humanitas-15-may-2026.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-interview-my-internet-kate-lindsay\",\"sender\":\"On Substack\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"On Substack\",\"publishedAt\":\"$undefined\",\"subject\":\"我的互联网：Kate Lindsay\",\"snippet\":\"Kate Lindsay 谈独立媒体、付费内容、网络文化及自己的互联网习惯。\",\"date\":\"2026-05-27\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"独立媒体\",\"付费内容\",\"网络文化\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/interview-my-internet-kate-lindsay.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-private-markets-software-repricing-and-capital-allocation-marc-rowan-on-a16z\",\"sender\":\"a16z\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"a16z\",\"publishedAt\":\"$undefined\",\"subject\":\"专访阿波罗CEO Marc Rowan：私募市场的演进与AI时代的信贷变革\",\"snippet\":\"a16z对话阿波罗全球管理公司CEO Marc Rowan。回顾创立阿波罗的传奇故事，阐述从私募股权到万亿美元退休服务与信贷巨头的转型，探讨AI与工业复兴背景下科技创投与私募信贷的交叉机遇。\",\"date\":\"2026-05-27\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"私募股权\",\"信贷\",\"人工智能\",\"风险投资\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/private-markets-software-repricing-and-capital-allocation-marc-rowan-on-a16z.md\",\"coverImage\":\"$undefined\"},{\"id\":\"dont-subscribe-so-casually\",\"sender\":\"henri\",\"author\":\"henri\",\"sourceAuthor\":\"Shmuel Berman\",\"authorAliases\":[\"henri\",\"Shmuel Berman\",\"Henri\",\"Hinbox\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"别随手订阅，尤其是 AI 订阅\",\"snippet\":\"这篇文章讨论订阅制如何改变人的消费习惯、偏好和自我塑造方式。普通商品买完后影响有限，订阅却会持续改写行为路径。AI 订阅尤其值得警惕，因为它既有订阅制的商业激励，又能通过对话进入思考、工作和判断过程。真正的问题不只是值不值钱，而是它会把你训练成什么样的人。\",\"date\":\"2026-05-26\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Notes\"],\"tags\":[\"订阅经济\",\"消费行为\",\"人工智能\",\"自我管理\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"notes/dont-subscribe-so-casually.md\",\"coverImage\":\"$undefined\"},{\"id\":\"ferrari-luce-ev-design-divide\",\"sender\":\"henri\",\"author\":\"henri\",\"sourceAuthor\":\"Jasper Jolly\",\"authorAliases\":[\"henri\",\"Jasper Jolly\",\"Henri\",\"Hinbox\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"法拉利首款电动车引发身份焦虑\",\"snippet\":\"法拉利发布首款纯电动车 Luce，外观由 Jony Ive 参与设计，定位从传统双门跑车扩展到五座、四门的高价电动车。新车性能数据强劲，但设计风格引发争议，市场反应冷淡，股价一度明显下跌。争议核心不只是电动化，而是法拉利如何在新能源时代保住品牌的速度、声音、稀缺性与身份感。\",\"date\":\"2026-05-26\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Notes\"],\"tags\":[\"电动汽车\",\"品牌管理\",\"工业设计\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"notes/ferrari-luce-ev-design-divide.md\",\"coverImage\":\"$undefined\"},{\"id\":\"ferrari-luce-identity-crisis\",\"sender\":\"henri\",\"author\":\"henri\",\"sourceAuthor\":\"jumploops\",\"authorAliases\":[\"henri\",\"jumploops\",\"Henri\",\"Hinbox\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"法拉利首款电动车引发的品牌身份争议\",\"snippet\":\"围绕 Ferrari Luce 的讨论集中在一个问题：法拉利进入纯电时代时，是否丢掉了自己的品牌识别度。许多评论不否认这是一辆设计完成度较高的车，但质疑它不像法拉利，反而接近现代电动车、亚洲品牌或苹果式极简产品。争议背后涉及豪华品牌、电动化、设计权力、收藏价值和用户群变化。\",\"date\":\"2026-05-26\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Notes\"],\"tags\":[\"电动汽车\",\"品牌管理\",\"工业设计\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"notes/ferrari-luce-identity-crisis.md\",\"coverImage\":\"$undefined\"},{\"id\":\"uber-ai-spending-roi-question\",\"sender\":\"henri\",\"author\":\"henri\",\"sourceAuthor\":\"Jake Angelo\",\"authorAliases\":[\"henri\",\"Jake Angelo\",\"Henri\",\"Hinbox\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"企业 AI 预算烧得太快，Uber 开始追问投入回报\",\"snippet\":\"Uber 在 2026 年前四个月用完全年 AI 编程工具预算后，COO Andrew Macdonald 对 AI 投入的实际回报提出质疑。问题不在于 AI 是否有用，而在于企业很难把 Claude Code 等工具的使用量，直接对应到更多有价值的用户功能。文章把 Uber 的困境放进更大的企业 AI 成本结构中：单次推理变便宜了，但智能体消耗的 token 更多，企业账单反而可能继续上升。\",\"date\":\"2026-05-26\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Notes\"],\"tags\":[\"AI编程\",\"企业预算\",\"投资回报\",\"生产率\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"notes/uber-ai-spending-roi-question.md\",\"coverImage\":\"$undefined\"},{\"id\":\"ai-code-review-slowly\",\"sender\":\"henri\",\"author\":\"henri\",\"sourceAuthor\":\"Nolan Lawson\",\"authorAliases\":[\"henri\",\"Nolan Lawson\",\"Henri\",\"Hinbox\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"用 AI 慢一点写出更好的代码\",\"snippet\":\"AI 编程不一定只意味着快速生成大量低质量代码。更有效的用法，是把多个模型当作代码审查员，让它们从不同角度寻找缺陷，再由开发者验证、取舍和修复。这样做未必提升速度，却能暴露隐藏问题，改善代码库健康度，也让开发者更深入理解系统的失败路径。\",\"date\":\"2026-05-25\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Notes\"],\"tags\":[\"AI编程\",\"代码审查\",\"软件质量\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"notes/ai-code-review-slowly.md\",\"coverImage\":\"$undefined\"},{\"id\":\"pope-leo-ai-encyclical\",\"sender\":\"henri\",\"author\":\"henri\",\"sourceAuthor\":\"Claire Giangravè\",\"authorAliases\":[\"henri\",\"Claire Giangravè\",\"Henri\",\"Hinbox\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"教宗良十四世把人工智能放进社会正义框架\",\"snippet\":\"教宗良十四世在首份通谕中把人工智能视为新一轮工业革命，强调技术必须服务人的尊严、民主、公平与公共利益。文章围绕大科技公司的权力集中、AI 军事化、劳动冲击、数据殖民、算法歧视和全球不平等等问题展开，核心关切是防止 AI 被少数资本和国家权力垄断。\",\"date\":\"2026-05-25\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Notes\"],\"tags\":[\"人工智能\",\"社会正义\",\"劳动尊严\",\"科技伦理\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"notes/pope-leo-ai-encyclical.md\",\"coverImage\":\"$undefined\"},{\"id\":\"popovich-spurs-locker-room-speech\",\"sender\":\"henri\",\"author\":\"henri\",\"sourceAuthor\":\"Jared Weiss and Mike Prada\",\"authorAliases\":[\"henri\",\"Jared Weiss and Mike Prada\",\"Jared Weiss\",\"Mike Prada\",\"Henri\",\"Hinbox\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"波波维奇更衣室训话唤醒马刺\",\"snippet\":\"波波维奇在马刺西决第三场失利后罕见走进更衣室训话，马刺随后在第四场大胜雷霆扳平系列赛。\",\"date\":\"2026-05-25\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Notes\"],\"tags\":[\"NBA\",\"篮球\",\"团队管理\",\"体育心理\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"notes/popovich-spurs-locker-room-speech.md\",\"coverImage\":\"$undefined\"},{\"id\":\"programming-books-decline\",\"sender\":\"henri\",\"author\":\"henri\",\"sourceAuthor\":\"Cyrus\",\"authorAliases\":[\"henri\",\"Cyrus\",\"Henri\",\"Hinbox\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"编程书退场之后，程序员学到了什么\",\"snippet\":\"这篇文章写的是编程书从技术学习中心位置退场的过程。过去，程序员靠厚重的技术书慢慢学习，边读边敲代码。现在，AI 聊天机器人、Copilot 和 Claude Code 接管了大量即时解答需求。问题不只是书卖得少了，而是学习软件开发的节奏变了：解释来得更快，动手变得更少，知识也更容易停在表面。\",\"date\":\"2026-05-25\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Notes\"],\"tags\":[\"编程教学\",\"AI辅助学习\",\"知识管理\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"notes/programming-books-decline.md\",\"coverImage\":\"$undefined\"},{\"id\":\"ai-labor-measurers-revenge\",\"sender\":\"henri\",\"author\":\"henri\",\"sourceAuthor\":\"Bilal Tahir\",\"authorAliases\":[\"henri\",\"Bilal Tahir\",\"Henri\",\"Hinbox\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"AI浪潮下的白领裁员与政治反噬\",\"snippet\":\"AI正在把企业里的中层管理、财务、法务、审计、流程协调等岗位推到裁员前线。文章把这类岗位称为测量者，意思是他们主要负责管理、汇报、审核和协调。作者进一步推演，AI会先削减公司内部的人际协调成本，再扩大个人产出差距，最终带来财富集中、政治反弹、监管压力和再分配需求。\",\"date\":\"2026-05-24\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Notes\"],\"tags\":[\"人工智能\",\"劳动市场\",\"政治经济\",\"组织管理\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"notes/ai-labor-measurers-revenge.md\",\"coverImage\":\"$undefined\"},{\"id\":\"lean-proof-golfing-with-claude-code\",\"sender\":\"henri\",\"author\":\"henri\",\"sourceAuthor\":\"Terence Tao\",\"authorAliases\":[\"henri\",\"Terence Tao\",\"Henri\",\"Hinbox\",\"陶哲轩\",\"陶哲轩（Terence Tao）\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"用 Claude Code 给 Lean 证明做瘦身与风格校准\",\"snippet\":\"Terence Tao演示把Claude Code用作Lean代码审查助手，检查风格规范、命名、参数隐式化和证明瘦身等工程维护问题。\",\"date\":\"2026-05-24\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Notes\"],\"tags\":[\"Lean\",\"Claude Code\",\"形式化数学\",\"代码审查\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"notes/lean-proof-golfing-with-claude-code.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-the-ai-paradox-more-automation-more-humans-more-work-dan-shipper\",\"sender\":\"Lenny's Podcast\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"Lenny's Podcast\",\"publishedAt\":\"$undefined\",\"subject\":\"AI 悖论：自动化越多，工作越多\",\"snippet\":\"本次访谈发生在未来的时间点（文本背景设定在2026年5月左右），播客主持人 Lenny Rachitsky 邀请了 Every 的创始人兼 CEO Dan Shipper 作为嘉宾。一年前，Dan 曾准确预测了 Claude Code 在 I辅助学习\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"notes/cs50-ai-computer-science-education.md\",\"coverImage\":\"$undefined\"},{\"id\":\"reports-pinterest-production-mcp\",\"sender\":\"ByteByteGo\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"ByteByteGo\",\"publishedAt\":\"$undefined\",\"subject\":\"Pinterest 如何构建生产级 MCP 生态系统\",\"snippet\":\"Pinterest 如何通过中央注册表、统一部署、两层授权、人工审批与可观测性，将 MCP 接入工程师的日常工作。\",\"date\":\"2026-05-11\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Reports\"],\"tags\":[\"MCP\",\"开发基础设施\",\"权限管理\",\"可观测性\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"reports/pinterest-production-mcp.md\",\"coverImage\":\"$undefined\"},{\"id\":\"the-wu-tapes-scott-wu-cognition\",\"sender\":\"henri\",\"author\":\"henri\",\"sourceAuthor\":\"Jeremy Stern\",\"authorAliases\":[\"henri\",\"Jeremy Stern\",\"Henri\",\"Hinbox\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"从竞赛天才到 AI 编程公司的创业者\",\"snippet\":\"Scott Wu 是 Cognition 创始人兼 CEO，也是美国信息学奥赛圈中极具代表性的人物。他从路易斯安那的数学和编程竞赛一路进入硅谷，在母亲病逝后创办 Cognition，推出 AI 编程代理 Devin。文章围绕他的成长、竞争心、创业路径、AI 代理判断、人类智能与 AGI 的关系展开，也呈现出新一代技术创始人的形成机制。\",\"date\":\"2026-05-10\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Notes\"],\"tags\":[\"AI编程\",\"创业\",\"编程竞赛\",\"科研生涯\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"notes/the-wu-tapes-scott-wu-cognition.md\",\"coverImage\":\"$undefined\"},{\"id\":\"your-job-isnt-programming\",\"sender\":\"henri\",\"author\":\"henri\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"henri\",\"Henri\",\"Hinbox\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"你的工作不是编程：管理复杂度才是核心\",\"snippet\":\"这篇文章挑战了程序员的传统认知，指出软件开发的真正瓶颈不在于编写代码，而在于人类理解复杂系统的能力。作者认为，仅仅通过更换技术栈（如 React 或 Rust）无法根治代码库质量差的问题。解决之道在于构建优质的抽象——即能够改变思考方式、隐藏次要细节并突出重要核心的 思想模型 。开发者的核心职责应当是管理复杂度，而非单纯地进行编码工作。\",\"date\":\"2026-05-10\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\" 与时代气质。\",\"date\":\"2026-05-10\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"AI编程\",\"智能体\",\"创业\",\"Devin\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/scott-wu-cognition-interview.md\",\"coverImage\":\"$undefined\"},{\"id\":\"agent-native-product-management\",\"sender\":\"henri\",\"author\":\"henri\",\"sourceAuthor\":\"Marcus Moretti\",\"authorAliases\":[\"henri\",\"Marcus Moretti\",\"Henri\",\"Hinbox\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"AI 代理时代的产品管理方法\",\"snippet\":\"AI 代理正在改变产品经理的日常工作。许多过去需要手写 SQL、写需求票、查数据、整理报告的流程，现在可以通过与代理对话完成。产品管理的重点因此转向策略、指标、用户反馈和复盘。文章围绕 Every 的 compound engineering 插件，介绍 ce-strategy 和 ce-product-pulse 两个技能，展示产品经理如何用代理完成策略制定、数据监控和产品迭代。\",\"date\":\"2026-05-09\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Notes\"],\"tags\":[\"产品管理\",\"智能体\",\"用户研究\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"notes/agent-native-product-management.md\",\"coverImage\":\"$undefined\"},{\"id\":\"wembanyama-playoff-masterpiece\",\"sender\":\"henri\",\"author\":\"henri\",\"sourceAuthor\":\"Jared Weiss\",\"authorAliases\":[\"henri\",\"Jared Weiss\",\"Henri\",\"Hinbox\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"文班亚马的季后赛成人礼\",\"snippet\":\"文班亚马在马刺对森林狼的西部半决赛第三场中打出统治级表现，帮助球队以115比108取胜，并取得系列赛2比1领先。文章围绕他的得分、防守、犯规危机和关键时刻选择展开，写出一个年轻巨星如何在真正的季后赛压力下证明自己。\",\"date\":\"2026-05-09\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Notes\"],\"tags\":[\"NBA\",\"篮球战术\",\"体育心理\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"notes/wembanyama-playoff-masterpiece.md\",\"coverImage\":\"$undefined\"},{\"id\":\"ai-math-research-gowers-chatgpt\",\"sender\":\"henri\",\"author\":\"henri\",\"sourceAuthor\":\"Timothy Gowers\",\"authorAliases\":[\"henri\",\"Timothy Gowers\",\"Henri\",\"Hinbox\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"AI开始进入数学研究的核心地带\",\"snippet\":\"Gowers记录使用ChatGPT 5.5 Pro进行数学研究的经历，模型改进加性数论开放问题上界，引发对数学研究未来的深层讨论。\",\"date\":\"2026-05-08\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Notes\"],\"tags\":[\"人工智能\",\"加性数论\",\"数学研究\",\"ChatGPT\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"notes/ai-math-research-gowers-chatgpt.md\",\"coverImage\":\"$undefined\"},{\"id\":\"bronze-age-human-evolution\",\"sender\":\"henri\",\"author\":\"henri\",\"sourceAuthor\":\"Dwarkesh Patel\",\"authorAliases\":[\"henri\",\"Dwarkesh Patel\",\"Henri\",\"Hinbox\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"青铜时代如何改变人类进化速度\",\"snippet\":\"David Reich 结合古代 DNA 研究，讨论过去一万年人类自然选择并未停滞，反而在农业社会和青铜时代之后明显加速。随着样本规模扩大和统计方法进步，研究者能够追踪具体基因变异的频率变化，看到免疫、代谢、乳糖消化、肤色和疾病风险等性状在历史中的快速波动。\",\"date\":\"2026-05-08\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Notes\"],\"tags\":[\"古代DNA\",\"人类进化\",\"自然选择\",\"考古学\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"notes/bronze-age-human-evolution.md\",\"coverImage\":\"$undefined\"},{\"id\":\"ffmpeg-hidden-engine-behind-internet-video\",\"sender\":\"henri\",\"author\":\"henri\",\"sourceAuthor\":\"Lex Fridman\",\"authorAliases\":[\"henri\",\"Lex Fridman\",\"Henri\",\"Hinbox\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"互联网视频背后的开源引擎\",\"snippet\":\"FFmpeg 和 VLC 是现代视频世界的底层设施。它们让 YouTube、Netflix、Chrome、OBS、智能电视和无数视频工具可以编码、解码、转码、播放与保存多媒体内容。访谈从视频播放的底层流程讲起，延伸到编解码器、容器、压缩算法、手写汇编、开源许可、工程伦理和社区文化。核心观点：好代码、开放协作、长期维护，比名气和商业包装更重要。\",\"date\":\"2026-05-07\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Notes\"],\"tags\":[\"FFmpeg\",\"VLC\",\"开源\",\"多媒体\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"notes/ffmpeg-hidden-engine-behind-internet-video.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-why-this-is-the-most-exciting-time-to-be-human-ken-ono-axiom-math\",\"sender\":\"EO\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"EO\",\"publishedAt\":\"$undefined\",\"subject\":\"为什么这是做人最激动人心的时代\",\"snippet\":\"通过回顾曾两次辍学却重塑了现代数学的传奇印度数学家斯里尼瓦瑟·拉马努金（Srinivasa Ramanujan）的故事，Ono 教授强调了好奇心、人类判断力以及深入连接概念的能力才是真正的“深度智能”。他呼吁教育体系应当超越刷题和应试，转而培养学生的惊奇感与创造力，因为真正的天才往往会被刻板的系统所遗漏。在知识变得越来越廉价的今天，发现问题和建立人性化的连接，才是人类不可替代的价值。\",\"date\":\"2026-05-07\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"人工智能\",\"数学研究\",\"好奇心\",\"科学发现\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/why-this-is-the-most-exciting-time-to-be-human-ken-ono-axiom-math.md\",\"coverImage\":\"$undefined\"},{\"id\":\"ai-supercomputer-network-mrc\",\"sender\":\"OpenAI\",\"author\":\"henri\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"henri\",\"Henri\",\"Hinbox\"],\"publisher\":\"OpenAI\",\"publishedAt\":\"$undefined\",\"subject\":\"AI训练为什么需要一种新型超级计算机网络\",\"snippet\":\"这期 OpenAI Podcast 讨论了前沿模型训练背后的网络瓶颈。Mark Handley 和 Greg Steinbrecher 解释，AI训练不是简单堆更多GPU，而是要让成千上万块GPU像一台机器一样同步工作。传统数据中心网络依赖平均流量统计，但AI训练最怕最慢的一条链路拖垮整体。OpenAI提出多路径可靠连接 MRC，用多路径分发、拥塞控制和故障绕行，让大规模训练更稳定、更高效。\",\"date\":\"2026-05-06\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Notes\"],\"tags\":[\"AI基础设施\",\"网络互连\",\"并行计算\",\"GPU\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"notes/ai-supercomputer-network-mrc.md\",\"coverImage\":\"$undefined\"},{\"id\":\"codex-for-knowledge-work\",\"sender\":\"Every\",\"author\":\"henri\",\"sourceAuthor\":\"Dan Shipper, Austin Tedesco\",\"authorAliases\":[\"henri\",\"Dan Shipper, Austin Tedesco\",\"Dan Shipper\",\"Austin Tedesco\",\"Henri\",\"Hinbox\"],\"publisher\":\"Every\",\"publishedAt\":\"$undefined\",\"subject\":\"Codex 正在变成知识工作的桌面操作台\",\"snippet\":\"这期访谈讨论 Codex 如何从面向高级工程师的编程工具，转向知识工作者的日常工作入口。Dan Shipper 和 Austin Tedesco 重点展示了 Codex 在写作、增长、招聘、邮件、Slack、Notion、KPI 追踪和市场推广计划中的实际用法，核心判断是：能写软件的代理，也能重组知识工作。\",\"date\":\"2026-05-06\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Notes\"],\"tags\":[\"Codex\",\"知识工作\",\"开发工作流\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"notes/codex-for-knowledge-work.md\",\"coverImage\":\"$undefined\"},{\"id\":\"yann-martel-writing-storytelling\",\"sender\":\"henri\",\"author\":\"henri\",\"sourceAuthor\":\"David Perell\",\"authorAliases\":[\"henri\",\"David Perell\",\"Henri\",\"Hinbox\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"扬·马特尔谈写作：故事不是解释世界，而是让读者参与创造\",\"snippet\":\"这期访谈围绕扬·马特尔的写作方法展开。他把研究材料剪裁、分类、放入信封，用一种近乎手工的方式组织小说结构；同时强调故事不能被事实填满，而要给读者留下想象空间。访谈还谈到动物角色、AI写作、类型小说与文学小说、人物描写、好结尾和艺术家的态度。核心观点是，小说的力量来自作者和读者之间的共同创造。\",\"date\":\"2026-05-06\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Notes\"],\"tags\":[\"写作\",\"叙事技巧\",\"AI写作\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"notes/yann-martel-writing-storytelling.md\",\"coverImage\":\"$undefined\"},{\"id\":\"essays-ai-job-apocalypse-fantasy\",\"sender\":\"David George\",\"author\":\"David George\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"David George\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"AI 工作末日论是幻想\",\"snippet\":\"文章反驳 AI 将造成永久性大规模失业的悲观叙事，指出这种论调忽视了技术降本、需求扩张和经济结构演化的历史规律。\",\"date\":\"2026-05-06\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Essays\"],\"tags\":[\"人工智能\",\"劳动市场\",\"经济增长\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"essays/ai-job-apocalypse-fantasy.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-why-we-switched-from-claude-code-to-codex\",\"sender\":\"Every\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"Every\",\"publishedAt\":\"$undefined\",\"subject\":\"为什么我们从 Claude Code 切换到 Codex\",\"snippet\":\"在本期访谈中，Every 创始人 Dan Shipper 与其增长主管 Austin Tedesco 探讨了人工智能代理（Agent）正在如何重塑知识工作者的日常工作流。两人分享了他们从最初使用 Claude Code（命令行界面）到全面转向 OpenAI 的 Codex 桌面应用的经历。 访谈的核心观点是：“AI 智能代理管理界面（Agent management interface）”正在成为知识工作的新一代操作系统。\",\"date\":\"2026-05-06\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"Claude Code\",\"Codex\",\"AI编程\",\"开发工作流\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/why-we-switched-from-claude-code-to-codex.md\",\"coverImage\":\"$undefined\"},{\"id\":\"jensen-huang-ai-computing-shift\",\"sender\":\"Milken Institute\",\"author\":\"henri\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"henri\",\"Henri\",\"Hinbox\"],\"publisher\":\"Milken Institute\",\"publishedAt\":\"$undefined\",\"subject\":\"黄仁勋谈AI时代的计算机重构\",\"snippet\":\"这场访谈围绕黄仁勋对AI产业下一阶段的判断展开。他认为，AI已经从生成内容进入智能体阶段，核心变化是计算机开始理解意图、规划任务、调用工具，并推动算力、能源、芯片、云基础设施和应用层全面重组。访谈也讨论了就业、再工业化、安全监管、出口政策和开源防御等问题。\",\"date\":\"2026-05-05\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Notes\"],\"tags\":[\"智能体\",\"计算机体系结构\",\"算力\",\"能源\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"notes/jensen-huang-ai-computing-shift.md\",\"coverImage\":\"$undefined\"},{\"id\":\"essays-agentic-coding-trap\",\"sender\":\"henri\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"智能体编程陷阱\",\"snippet\":\"文章警惕智能体编程带来的认知债务、技能退化和供应商锁定，提醒开发者不要把理解、判断和架构责任过早外包给工具。\",\"date\":\"2026-05-05\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Essays\"],\"tags\":[\"AI编程\",\"智能体\",\"技能退化\",\"软件架构\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"essays/agentic-coding-trap.md\",\"coverImage\":\"$undefined\"},{\"id\":\"essays-mercury-haskell-production\",\"sender\":\"Haskell.org\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"Haskell.org\",\"publishedAt\":\"$undefined\",\"subject\":\"Mercury 的百万行 Haskell 生产实践\",\"snippet\":\"Mercury 工程师回顾在金融科技生产环境中维护数百万行 Haskell 的经验，讨论类型系统、组织知识和运维可靠性如何共同支撑高速增长的业务。\",\"date\":\"2026-05-05\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Essays\"],\"tags\":[\"Haskell\",\"类型系统\",\"软件可靠性\",\"金融科技\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"essays/mercury-haskell-production.md\",\"coverImage\":\"$undefined\"},{\"id\":\"ai-jobs-and-human-skills\",\"sender\":\"henri\",\"author\":\"henri\",\"sourceAuthor\":\"Scott Galloway（受访）\",\"authorAliases\":[\"henri\",\"Scott Galloway（受访）\",\"Scott Galloway\",\"Henri\",\"Hinbox\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"AI 会改写工作，但真正值钱的是人类技能\",\"snippet\":\"这期访谈里，斯科特·盖洛威反对把 AI 描述成马上吞噬所有工作的末日机器。他认为，科技 CEO 的灾难叙事很大程度上服务于融资和估值。AI 会重塑劳动力市场，让懂 AI 的人获得杠杆，但真正稀缺的能力会转向讲故事、关系经营、抗拒绝能力、判断力和真实的人际连接。\",\"date\":\"2026-05-04\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Notes\"],\"tags\":[\"人工智能\",\"劳动市场\",\"人际沟通\",\"职业发展\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"notes/ai-jobs-and-human-skills.md\",\"coverImage\":\"$undefined\"},{\"id\":\"stripe-internal-ai-prototyping-tool\",\"sender\":\"How I AI\",\"author\":\"henri\",\"sourceAuthor\":\"Claire Vo, Owen Williams\",\"authorAliases\":[\"henri\",\"Claire Vo, Owen Williams\",\"Claire Vo\",\"Owen Williams\",\"Henri\",\"Hinbox\"],\"publisher\":\"How I AI\",\"publishedAt\":\"$undefined\",\"subject\":\"Stripe 如何用内部 AI 工具改造产品原型流程\",\"snippet\":\"Stripe 设计经理 Owen Williams 介绍了内部原型工具 Protodash 的形成过程。它把 Stripe 的设计系统、React 组件、Cursor 规则、MCP 和开发机环境结合起来，让设计师和产品经理不用写代码，也能快速生成接近真实产品的数据仪表盘原型，并把设计评审从静态稿件推进到可交互演示。\",\"date\":\"2026-05-04\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Notes\"],\"tags\":[\"原型设计\",\"设计系统\",\"AI编程\",\"MCP\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"notes/stripe-internal-ai-prototyping-tool.md\",\"coverImage\":\"$undefined\"},{\"id\":\"steve-woz-commencement\",\"sender\":\"GVSU Student Life\",\"author\":\"henri\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"henri\",\"Henri\",\"Hinbox\"],\"publisher\":\"GVSU Student Life\",\"publishedAt\":\"$undefined\",\"subject\":\"沃兹尼亚克毕业演讲：把好奇心做成普通人能用的东西\",\"snippet\":\"沃兹尼亚克在毕业演讲中回顾设计Apple I和Apple II的经历，强调好奇心、简化设计和开放分享是人生核心动力。\",\"date\":\"2026-05-03\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Notes\"],\"tags\":[\"计算机史\",\"产品设计\",\"好奇心\",\"开源\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"notes/steve-woz-commencement.md\",\"coverImage\":\"$undefined\"},{\"id\":\"vibe-coding-agent-control\",\"sender\":\"henri\",\"author\":\"henri\",\"sourceAuthor\":\"David Ondrej\",\"authorAliases\":[\"henri\",\"David Ondrej\",\"Henri\",\"Hinbox\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"别迷信氛围编程，真正有用的是可控的智能体工作流\",\"snippet\":\"这期访谈围绕 Mario Zechner 开发 Pi 编码代理的经历展开。核心观点很直接：AI 编程真正的价值不在于一口气造出爆款产品，而在于让个人和小团队更快构建内部工具、验证想法、处理数据和改造工作流。Mario 批评行业炒作过度，强调控制权、上下文稳定、架构判断和代币成本，认为未来优势会流向懂系统、懂验证、买得起算力并会调度智能体的人。\",\"date\":\"2026-05-03\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Notes\"],\"tags\":[\"AI编程\",\"智能体\",\"开发工作流\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"notes/vibe-coding-agent-control.md\",\"coverImage\":\"$undefined\"},{\"id\":\"essays-agent-skills-engineering-discipline\",\"sender\":\"Addy Osmani\",\"author\":\"Addy Osmani\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Addy Osmani\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"Agent Skills：给 AI 编程补上工程纪律\",\"snippet\":\"Addy Osmani 解释为什么 AI 编程智能体容易绕过规格、测试和评审，并提出用可执行的 Skills 工作流把资深工程师的工程纪律嵌入协作过程。\",\"date\":\"2026-05-03\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Essays\"],\"tags\":[\"AI编程\",\"智能体\",\"软件工程\",\"开发工作流\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"essays/agent-skills-engineering-discipline.md\",\"coverImage\":\"$undefined\"},{\"id\":\"ai-era-agency-product-building\",\"sender\":\"Lenny's Podcast\",\"author\":\"henri\",\"sourceAuthor\":\"Max Schoening（嘉宾）\",\"authorAliases\":[\"henri\",\"Max Schoening（嘉宾）\",\"Max Schoening\",\"Henri\",\"Hinbox\"],\"publisher\":\"Lenny's Podcast\",\"publishedAt\":\"$undefined\",\"subject\":\"AI 时代的产品能力，关键在自主性\",\"snippet\":\"Max Schoening 从 Notion 的实践出发，谈 AI 如何改变产品构建方式。设计师和产品经理开始用代码做原型，角色边界被重新划分，但真正拉开差距的不是技能，而是自主性、品味、对材料的理解，以及持续动手改变现状的能力。\",\"date\":\"2026-05-02\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Notes\"],\"tags\":[\"产品管理\",\"产品设计\",\"自主性\",\"AI编程\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"notes/ai-era-agency-product-building.md\",\"coverImage\":\"$undefined\"},{\"id\":\"tangping-and-burnout-society\",\"sender\":\"听闻\",\"author\":\"henri\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"henri\",\"Henri\",\"Hinbox\"],\"publisher\":\"听闻\",\"publishedAt\":\"$undefined\",\"subject\":\"躺平背后的疲惫、压力与自救\",\"snippet\":\"躺平并不是简单的懒散姿态，而是年轻人在高房价、长工时、低安全感和婚育压力下产生的疲惫反应。努力仍然重要，但当努力难以通向稳定生活，人就会开始怀疑奋斗叙事。躺平更像一种低声抗议，也是一种保住精神余地的自救方式。\",\"date\":\"2026-05-02\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Notes\"],\"tags\":[\"劳动市场\",\"社会压力\",\"心理健康\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"notes/tangping-and-burnout-society.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-nat-friedman-and-daniel-gross-in-conversation-with-john-and-patrick-collison\",\"sender\":\"Stripe\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"Stripe\",\"publishedAt\":\"$undefined\",\"subject\":\"Nat Friedman 与 Daniel Gross 对谈 Collison 兄弟\",\"snippet\":\"在本场 Stripe Sessions 的压轴对谈中，Stripe 联合创始人 John Collison 和 Patrick Collison 邀请了科技界最活跃的两位 AI 投资者——Nat Friedman 和 Daniel Gross，共同探讨前沿技术（特别是人工智能）将如何重塑全球经济。 整场对话围绕“技术奇点（Singularity）”展开。\",\"date\":\"2026-05-01\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"人工智能\",\"风险投资\",\"企业战略\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/nat-friedman-and-daniel-gross-in-conversation-with-john-and-patrick-collison.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-openai-s-greg-brockman-why-human-attention-is-the-new-bottleneck\",\"sender\":\"Sequoia Capital\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"Sequoia Capital\",\"publishedAt\":\"$undefined\",\"subject\":\"Greg Brockman：人类注意力是新瓶颈\",\"snippet\":\"在红杉资本举办的 AI Ascent 2026 大会上，红杉合伙人 Alfred Lin 与 OpenAI 联合创始人兼总裁 Greg Brockman 进行了一场深入对话，涵盖了 OpenAI 整个技术和业务栈。Greg 解释了为什么 OpenAI 永远不会有“足够”的算力、为什么他认为我们距离 AGI（通用人工智能）已经完成了 80% 的进程，以及为什么在去年 12 月还只能帮你写 20% 代码的“智能体编程工具”\",\"date\":\"2026-05-01\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"人工智能\",\"注意力\",\"产品开发\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/openai-s-greg-brockman-why-human-attention-is-the-new-bottleneck.md\",\"coverImage\":\"$undefined\"},{\"id\":\"llm-training-serving-infrastructure\",\"sender\":\"henri\",\"author\":\"henri\",\"sourceAuthor\":\"Dwarkesh Patel\",\"authorAliases\":[\"henri\",\"Dwarkesh Patel\",\"Henri\",\"Hinbox\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"大模型背后的算力账本：GPT、Claude 与 Gemini 是如何训练和服务的\",\"snippet\":\"这期视频是一场关于前沿大模型工程系统的黑板课。Reiner Pope 从批量大小、内存带宽、计算吞吐、KV 缓存、MoE、机架互连和流水线并行讲起，解释为什么模型 API 会有不同价格，为什么长上下文更贵，为什么模型架构越来越受硬件物理条件约束。核心观点很直接：大模型不是只靠算法在跑，而是在算力、内存、网络、成本之间做极限平衡。\",\"date\":\"2026-04-30\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Notes\"],\"tags\":[\"大语言模型\",\"模型训练\",\"并行计算\",\"推理优化\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"notes/llm-training-serving-infrastructure.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-how-gpt-claude-and-gemini-are-actually-trained-and-served-reiner-pope\",\"sender\":\"Dwarkesh Patel\",\"author\":\"Dwarkesh Patel\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Dwarkesh Patel\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"GPT、Claude 和 Gemini 的训练与部署全解析\",\"snippet\":\"在本期播客中，主持人 Dwarkesh Patel 采用了一种非常新颖的“黑板讲座”形式，采访了初创芯片公司 MatX 的 CEO、前 Google TPU 架构师 Reiner Pope。两人深入硬核的技术细节，在黑板上通过一系列公式推导，探讨了前沿大语言模型（LLMs）是如何进行训练和部署的。\",\"date\":\"2026-04-30\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"大语言模型\",\"模型训练\",\"芯片\",\"推理优化\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/how-gpt-claude-and-gemini-are-actually-trained-and-served-reiner-pope.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-mark-cuban-ai-hype-vs-reality-openai-s-wasting-1-trillion-lebron-vs-jordan\",\"sender\":\"Alex Kantrowitz\",\"author\":\"Alex Kantrowitz\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Alex Kantrowitz\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"Mark Cuban 谈 AI 炒作与现实\",\"snippet\":\"在本期《Big Technology Podcast》播客中，主持人 Alex Kantrowitz 邀请到了著名企业家、投资者（也是前达拉斯独行侠队老板）Mark Cuban。两人在现场观众面前进行了一场关于人工智能（AI）的深度对话。 Mark Cuban 坚信，AI 的发展并不是线性的，而是呈指数级爆发的。\",\"date\":\"2026-04-30\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"人工智能\",\"模型评估\",\"企业管理\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/mark-cuban-ai-hype-vs-reality-openai-s-wasting-1-trillion-lebron-vs-jordan.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-sam-altman-in-conversation-with-patrick-collison\",\"sender\":\"Stripe\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"Stripe\",\"publishedAt\":\"$undefined\",\"subject\":\"Sam Altman 对谈 Patrick Collison\",\"snippet\":\"在 2026 年的 Stripe Sessions 大会上，Stripe 联合创始人兼 CEO Patrick Collison 与 OpenAI 联合创始人兼 CEO Sam Altman 进行了一场“炉边谈话（Fireside chat）”。原定受访嘉宾是 OpenAI 总裁 Greg Brockman，但因故换成了与 Patrick 认识近 20 年、且是 Stripe 早期投资人的 Sam Altman。\",\"date\":\"2026-04-30\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"人工智能\",\"企业战略\",\"产品开发\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/sam-altman-in-conversation-with-patrick-collison.md\",\"coverImage\":\"$undefined\"},{\"id\":\"llm-training-serving-math\",\"sender\":\"henri\",\"author\":\"henri\",\"sourceAuthor\":\"Dwarkesh Patel, Reiner Pope\",\"authorAliases\":[\"henri\",\"Dwarkesh Patel, Reiner Pope\",\"Dwarkesh Patel\",\"Reiner Pope\",\"Henri\",\"Hinbox\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"从芯片到模型，推导大模型训练与推理的真实成本\",\"snippet\":\"这场黑板课把大模型训练和服务拆成一组工程问题。核心不在模型名字，而在GPU集群、显存带宽、批量大小、MoE布局、流水线并行、长上下文缓存和API价格之间的关系。\",\"date\":\"2026-04-29\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Notes\"],\"tags\":[\"大语言模型\",\"模型训练\",\"推理优化\",\"计算成本\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"notes/llm-training-serving-math.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-dwarkesh-reiner-pope\",\"sender\":\"Dwarkesh Patel\",\"author\":\"Dwarkesh Patel\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Dwarkesh Patel\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"Reiner Pope：大语言模型训练与服务背后的数学\",\"snippet\":\"以黑板讲解批大小、计算和带宽、混合专家模型、流水线并行与长上下文推理成本。\",\"date\":\"2026-04-29\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"大语言模型\",\"模型训练\",\"并行计算\",\"计算规模\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/dwarkesh-reiner-pope.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-getting-agent-ready-with-stripe-s-head-of-data-and-ai\",\"sender\":\"Every\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"Every\",\"publishedAt\":\"$undefined\",\"subject\":\"Stripe 数据与 AI 负责人谈 Agent 准备\",\"snippet\":\"节目片头： 互联网上出现了一种新型的参与者。随着时间的推移，这种参与者——也就是 AI 代理（Agents）——将成为互联网上的主要活动者。从收入的角度来看，这些 AI 公司的增长速度比我们过去见过的任何企业群体都要快。访问 Stripe 开发者文档的 LLM（大语言模型）流量同比增长了 10 倍。这是一个非常有用的信号：机器也正在成为开发者基础设施的用户，其中就包括 Stripe 的开发者基础设施。\",\"date\":\"2026-04-29\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"智能体\",\"企业数据\",\"开发基础设施\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/getting-agent-ready-with-stripe-s-head-of-data-and-ai.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-karpathy-vibe-coding-agentic-engineering\",\"sender\":\"Sequoia Capital\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"Sequoia Capital\",\"publishedAt\":\"$undefined\",\"subject\":\"Andrej Karpathy：从氛围编程到智能体工程\",\"snippet\":\"Andrej Karpathy 在 AI Ascent 访谈中讨论软件 3.0、氛围编程与智能体工程的演进，并强调人类理解、品味和监督在 AI 编程时代仍不可替代。\",\"date\":\"2026-04-29\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"AI编程\",\"智能体\",\"人机协作\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/karpathy-vibe-coding-agentic-engineering.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-what-happens-now-that-ai-is-good-at-math-the-openai-podcast-ep-17\",\"sender\":\"OpenAI\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"OpenAI\",\"publishedAt\":\"$undefined\",\"subject\":\"AI 擅长数学之后会怎样\",\"snippet\":\"Andrew Mayne：大家好，我是 Andrew Mayne，这里是 OpenAI 播客。今天我们的嘉宾是研究员 Sebastian Bubeck 和 Ernest Ryu。我们将讨论数学，探讨 AI 是如何从“只会算术”跃升到“奥数级别”，以及为什么实现通用人工智能（AGI）必须攻克数学难题。\",\"date\":\"2026-04-29\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"人工智能\",\"数学研究\",\"定理证明\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/what-happens-now-that-ai-is-good-at-math-the-openai-podcast-ep-17.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-writing-advice-every-writer-should-hear-anne-lamott-interview\",\"sender\":\"David Perell\",\"author\":\"David Perell\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"David Perell\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"Anne Lamott 谈写作心法\",\"snippet\":\"在本次访谈中，两人深入探讨了写作的过程与心态。Anne 分享了她对“作家瓶颈”的独特见解，认为那其实是内心“空了”的错觉；她讲述了自己如何写出三稿（儿童草稿、成人草稿、牙医草稿）；并探讨了如何应对“内心的批评家”、如何写出真实生动的对话、怎样寻找写作灵感，以及如何面对外界的批评。最后，她谈到了“敬畏感（Reverence）”对作家乃至每个人的重要性——为了感受生命的全部，我们需要褪下盔甲，甚至不惜承受伤害。\",\"date\":\"2026-04-29\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"写作\",\"创作\",\"自我管理\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/writing-advice-every-writer-should-hear-anne-lamott-interview.md\",\"coverImage\":\"$undefined\"},{\"id\":\"bloomberg-terminal-ai-makeover\",\"sender\":\"henri\",\"author\":\"henri\",\"sourceAuthor\":\"Joel Khalili\",\"authorAliases\":[\"henri\",\"Joel Khalili\",\"Henri\",\"Hinbox\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"彭博终端的 AI 改造正在改变金融分析入口\",\"snippet\":\"彭博正在为终端引入名为 ASKB 的 AI 交互界面，让金融从业者用自然语言查询数据、构建分析流程、测试投资假设。它不会替代专业判断，也不能直接给出买卖信号，而是把原本繁琐的数据检索、文件阅读和摘要整理压缩到更短时间内。真正的竞争点仍然是人的问题意识、专业判断和对结果来源的核验能力。\",\"date\":\"2026-04-28\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Notes\"],\"tags\":[\"人工智能\",\"金融分析\",\"数据检索\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"notes/bloomberg-terminal-ai-makeover.md\",\"coverImage\":\"$undefined\"},{\"id\":\"paul-tudor-jones-ai-risk-bubbles-buffett\",\"sender\":\"Invest Like The Best\",\"author\":\"henri\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"henri\",\"Henri\",\"Hinbox\"],\"publisher\":\"Invest Like The Best\",\"publishedAt\":\"$undefined\",\"subject\":\"保罗·都铎·琼斯谈交易、AI风险与复利\",\"snippet\":\"保罗·都铎·琼斯回顾了自己五十年的交易生涯，从白银崩盘、1987年股灾、比特币、主权债务泡沫谈到AI风险。他把交易看作风险管理，把巴菲特看作复利信念的代表。访谈后半段转向慈善、教育、信息过载、人生意义与善意的力量。\",\"date\":\"2026-04-28\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Notes\"],\"tags\":[\"交易\",\"风险管理\",\"复利\",\"人工智能\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"notes/paul-tudor-jones-ai-risk-bubbles-buffett.md\",\"coverImage\":\"$undefined\"},{\"id\":\"smartphones-to-ar-glasses\",\"sender\":\"Stripe\",\"author\":\"henri\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"henri\",\"Henri\",\"Hinbox\"],\"publisher\":\"Stripe\",\"publishedAt\":\"$undefined\",\"subject\":\"手机之后，是一副真正理解世界的眼镜\",\"snippet\":\"这期访谈围绕 Snap CEO Evan Spiegel 对下一代计算平台的判断展开。他认为智能手机把人拉进屏幕，而 AR 眼镜有机会把计算重新带回现实世界。访谈也谈到 Specs 的硬件难题、AI 改造软件开发、Snapchat 的社交逻辑、订阅商业模式、青少年用机争议，以及 Snap 从通讯产品走向空间计算平台的野心。\",\"date\":\"2026-04-27\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Notes\"],\"tags\":[\"增强现实\",\"消费者产品\",\"产品设计\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"notes/smartphones-to-ar-glasses.md\",\"coverImage\":\"$undefined\"},{\"id\":\"xchat-messenger-not-signal\",\"sender\":\"henri\",\"author\":\"henri\",\"sourceAuthor\":\"Reece Rogers\",\"authorAliases\":[\"henri\",\"Reece Rogers\",\"Henri\",\"Hinbox\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"XChat 的问题不在加密口号，而在产品本身\",\"snippet\":\"XChat 被马斯克包装成安全加密通信应用，但文章认为它更像 X 平台的附属私信工具，而不是 Signal 这类独立、安全、成熟的通信产品。它依赖 X 账户，隐私政策含混，功能粗糙，发布过程混乱，实际使用场景也很窄。所谓加密卖点并不能掩盖它作为社交平台延伸产品的局限。\",\"date\":\"2026-04-27\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Notes\"],\"tags\":[\"即时通信\",\"隐私保护\",\"网络安全\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"notes/xchat-messenger-not-signal.md\",\"coverImage\":\"$undefined\"},{\"id\":\"you-are-the-most-expensive-model\",\"sender\":\"henri\",\"author\":\"henri\",\"sourceAuthor\":\"Mike Taylor\",\"authorAliases\":[\"henri\",\"Mike Taylor\",\"Henri\",\"Hinbox\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"你的时间才是最贵的模型\",\"snippet\":\"AI 工作流的真正成本不只在模型调用费，而在人的注意力。文章提出增量确定性框架：把重复任务从临时对话逐步沉淀为技能、评测、脚本和可优化脚本，让便宜模型和确定性代码承担简单环节，把人的判断力留给真正需要人的地方。\",\"date\":\"2026-04-27\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Notes\"],\"tags\":[\"开发工作流\",\"成本优化\",\"注意力\",\"模型评估\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"notes/you-are-the-most-expensive-model.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-what-comes-after-smartphones-with-evan-spiegel-of-snap\",\"sender\":\"Stripe\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"Stripe\",\"publishedAt\":\"$undefined\",\"subject\":\"Evan Spiegel 谈智能手机之后的未来\",\"snippet\":\"在本期访谈中，Snap 首席执行官埃文·斯皮格尔（Evan Spiegel）在一家英式小酒馆里与主持人 John 进行了一次深度对话，探讨了 Snap 在 2026 年迎来的“关键转折点”：备受期待的消费者版本 Spectacles 智能眼镜的发布。 埃文在对话中分享了他对计算平台演进的深刻理解。他认为智能手机已经变成了一种让人相互孤立的传统设备，而真正的增强现实（AR）眼镜迈出了让计算“回归人性”、让人们重连现实世界的第一步。\",\"date\":\"2026-04-27\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"增强现实\",\"消费者产品\",\"产品设计\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/what-comes-after-smartphones-with-evan-spiegel-of-snap.md\",\"coverImage\":\"$undefined\"},{\"id\":\"cerebras-ipo-ai-inference-chip\",\"sender\":\"最佳拍档\",\"author\":\"henri\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"henri\",\"Henri\",\"Hinbox\"],\"publisher\":\"最佳拍档\",\"publishedAt\":\"$undefined\",\"subject\":\"Cerebras冲刺IPO：晶圆级芯片挑战英伟达推理霸权\",\"snippet\":\"这期视频讲述AI芯片公司Cerebras冲刺IPO的故事。它用晶圆级芯片和片上SRAM路线切入AI推理市场，试图绕开英伟达GPU在内存带宽上的瓶颈。视频重点分析了Cerebras的技术突破、商业化路径、OpenAI和AWS等大客户合作，以及它对AI推理芯片格局的潜在冲击。\",\"date\":\"2026-04-26\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Notes\"],\"tags\":[\"AI芯片\",\"推理优化\",\"资本市场\",\"企业战略\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"notes/cerebras-ipo-ai-inference-chip.md\",\"coverImage\":\"$undefined\"},{\"id\":\"essays-ai-agent-destroyed-production-data\",\"sender\":\"JER (@lifeof_jer)\",\"author\":\"JER (@lifeof_jer)\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"JER (@lifeof_jer)\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"一个 AI 智能体如何删除生产数据\",\"snippet\":\"PocketOS 创始人记录一次 AI 编程智能体误删生产数据库的 30 小时时间线，揭示工具权限、基础设施 API 和安全营销之间的系统性缺口。\",\"date\":\"2026-04-26\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Essays\"],\"tags\":[\"AI编程\",\"数据库安全\",\"事故复盘\",\"权限管理\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"essays/ai-agent-destroyed-production-data.md\",\"coverImage\":\"$undefined\"},{\"id\":\"reports-deepseek-v4-technical-report\",\"sender\":\"henri\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"DeepSeek V4 技术报告解读\",\"snippet\":\"DeepSeek V4 系列技术报告深度解读：混合注意力架构（CSA + HCA）、流形约束超连接（mHC）、Muon 优化器、FP4 量化感知训练等核心创新，实现百万 Token 长上下文的高效原生支持。\",\"date\":\"2026-04-26\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Reports\"],\"tags\":[\"DeepSeek\",\"大语言模型\",\"模型架构\",\"量化\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"reports/deepseek-v4-technical-report.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-how-to-win-when-software-is-not-a-moat-evan-spiegel-snapchat-ceo\",\"sender\":\"Lenny's Podcast\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"Lenny's Podcast\",\"publishedAt\":\"$undefined\",\"subject\":\"软件护城河消失后如何取胜\",\"snippet\":\"在本期播客中，主持人 Lenny Rachitsky 对话了 Snap 的联合创始人兼 CEO Evan Spiegel。Evan 是世界上极少数成功打造并规模化了一款持久的消费者社交产品的人之一。目前，Snapchat 拥有近 10 亿月活跃用户（MAU），年收入超过 60 亿美元。\",\"date\":\"2026-04-26\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"消费者产品\",\"企业战略\",\"社交媒体\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/how-to-win-when-software-is-not-a-moat-evan-spiegel-snapchat-ceo.md\",\"coverImage\":\"$undefined\"},{\"id\":\"essays-do-i-belong-in-tech-anymore\",\"sender\":\"Ky\",\"author\":\"Ky\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Ky\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"我还属于科技行业吗？\",\"snippet\":\"辞职那天，作者感到的是一阵释然，而不是惶恐。这篇坦诚的自述，记录了一位资深设计工程师如何被日渐蔓延的\\\"AI 疲劳\\\"和科技行业价值观的失落所吞噬。她并非反对技术本身，而是厌倦了一个加速运转却失去反思能力的系统：AI 未经同意地记录会议、代码未经审阅就批量合入、设计评审沉溺于生成式原型的视觉细节而忽略了真正的思考。更深层的，是她所信仰的那个进步、包容、以用户为本的科技行业，正在权力与资本面前节节后退。这篇文章没有给出简单的结论，而是提出了一\",\"date\":\"2026-04-25\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Essays\"],\"tags\":[\"职业发展\",\"科技行业\",\"人工智能\",\"设计\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"essays/do-i-belong-in-tech-anymore.md\",\"cover my-phone-replaced-a-brass-plug.md\",\"coverImage\":\"$undefined\"},{\"id\":\"essays-to-protect-and-swerve-nypd-cop-has-547-speeding-tickets-yet\",\"sender\":\"J.K. Trotter\",\"author\":\"J.K. Trotter\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"J.K. Trotter\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"保护与超速：NYPD 警官累计 547 张超速罚单仍在岗\",\"snippet\":\"纽约市警局一名警官在三年内累计收到 547 张超速罚单，却依然在岗执勤——这个数字本身就构成了一个令人不安的悖论。本文作者 J.K. Trotter 通过对交通摄像头罚单数据的追踪，还原了詹姆斯·乔瓦南蒂在斯塔滕岛上的危险驾驶模式：集中在学校周边的超速行为、重达近五千磅的皮卡车型、以及 NYPD 以\\\"与工作无关\\\"为由拒绝追责的态度。文章的核心张力在于：一个本应执行交通法规的执法者，却在系统性地违反它，而制度对此近乎默许。这不仅是个人行为\",\"date\":\"2026-04-23\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Essays\"],\"tags\":[\"公共问责\",\"交通安全\",\"执法监督\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"essays/to-protect-and-swerve-nypd-cop-has-547-speeding-tickets-yet.md\",\"coverImage\":\"$undefined\"},{\"id\":\"reports-what-we-learned-building-cloud-agents\",\"sender\":\"Cognition Team\",\"author\":\"Cognition Team\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Cognition Team\",\"The Cognition Team\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"构建云智能体的经验教训\",\"snippet\":\"Building cloud agents is difficult. We share some learnings from building Devin.\",\"date\":\"2026-04-23\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Reports\"],\"tags\":[\"云计算\",\"智能体\",\"Devin\",\"软件架构\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"reports/what-we-learned-building-cloud-agents.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-how-anthropics-product-team-moves-faster-than-anyone-else-cat-wu-head-of-product-claude-code\",\"sender\":\"Lenny's Podcast\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"Lenny's Podcast\",\"publishedAt\":\"$undefined\",\"subject\":\"Anthropic 产品团队为何比所有人跑得都快：Claude Code 产品负责人 Cat Wu 专访\",\"snippet\":\"Anthropic Claude Code 产品负责人 Cat Wu 深度分享：产品发布周期从数月压缩至数天、产品品味成为最核心技能、AI 时代产品经理的全新工作法则\",\"date\":\"2026-04-23\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"Claude Code\",\"产品管理\",\"产品设计\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/how-anthropics-product-team-moves-faster-than-anyone-else-cat-wu-head-of-product-claude-code.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-software-fundamentals-matter-more-than-ever-matt-pocock\",\"sender\":\"Alex Kantrowitz\",\"author\":\"Alex Kantrowitz\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Alex Kantrowitz\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"AI 时代的软件基本功\",\"snippet\":\"AI 编程工具虽然被过度炒作，但同时也极其强大。如果使用得当，它们会表现得非常出色；但如果使用不当，它们会比任何人类团队更快地让你陷入“面条式代码”（混乱代码）的泥潭。造成这种差异的原因不在于工具本身，而在于流程。 在过去 18 个月指导开发者使用 AI 智能体进行构建的过程中，Matt Pocock 观察到了一个共同的规律：那些取得成功的开发者，既不是把所有事情都外包给 AI 的人，也不是完全不用 AI 的人\",\"date\":\"2026-04-23\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"AI编程\",\"软件工程\",\"软件架构\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/software-fundamentals-matter-more-than-ever-matt-pocock.md\",\"coverImage\":\"$undefined\"},{\"id\":\"china-deflation-survival-strategy\",\"sender\":\"henri\",\"author\":\"henri\",\"sourceAuthor\":\"大内鲁社长\",\"authorAliases\":[\"henri\",\"大内鲁社长\",\"Henri\",\"Hinbox\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"中国大通缩的成因与个人防守策略\",\"snippet\":\"中国经济正在面对一种由债务、房地产、人口老龄化和分配结构共同压出的通缩压力。价格下行只是表面，更深处是居民收入预期下降、资产缩水、地方财政收缩、企业投资意愿变弱。普通人的策略不再是追求暴富，而是降低风险，保住现金流、职业稳定性和长期选择权。\",\"date\":\"2026-04-22\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Notes\"],\"tags\":[\"通缩\",\"债务\",\"房地产\",\"个人理财\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"notes/china-deflation-survival-strategy.md\",\"coverImage\":\"$undefined\"},{\"id\":\"reports-multi-agents-what-s-actually-working\",\"sender\":\"Walden (@walden_yan)\",\"author\" $undefined\",\"subject\":\"你的 AI 并不笨——它只是需要更好的缰绳\",\"snippet\":\"当你的 AI Agent 在第十步突然崩溃、编造数据、输出乱码时，你很容易觉得是模型不够聪明。但这篇文章提出了一个更值得深思的诊断：问题不在马，而在缰绳。作者梳理了 AI 工程从 Prompt Engineering 到 Context Engineering、再到 Harness Engineering 的范式跃迁，指出对于长周期自主任务而言，核心瓶颈已不再是「提问方式」或「知识范围」，而是系统有没有为模型设计好一套可执行的约束框架。\",\"date\":\"2026-04-16\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Reports\"],\"tags\":[\"智能体\",\"上下文工程\",\"软件架构\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"reports/your-ai-isnt-stupid-it-just-needs-a-better-harness-lychee-te.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-cursor-coding-agents-tutorial-2026\",\"sender\":\"leerob\",\"author\":\"leerob\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"leerob\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"掌握AI编程智能体：Cursor使用进阶指南\",\"snippet\":\"一门关于如何高效使用AI编程智能体构建软件的进阶教程。以Cursor为例，系统阐述智能体的工作原理，涵盖提示词与上下文管理、代码库搜索、计划模式开发新功能、调试Bug、Bugbot代码审查与自动化测试，以及规则与技能的团队定制。\",\"date\":\"2026-04-16\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"Cursor\",\"AI编程\",\"上下文工程\",\"代码审查\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/cursor-coding-agents-tutorial-2026.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-jensen-huang-will-nvidias-moat-persist\",\"sender\":\"Dwarkesh Patel\",\"author\":\"Dwarkesh Patel\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Dwarkesh Patel\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"黄仁勋访谈：英伟达的护城河能否持续？\",\"snippet\":\"黄仁勋与 Dwarkesh Patel 深度对谈英伟达的护城河、TPU 竞争、对华芯片出口管制、AI 基础设施战略等核心议题\",\"date\":\"2026-04-16\",\"isRead\":true,\"isStarred\":true,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"AI芯片\",\"供应链\",\"出口管制\",\"企业战略\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/jensen-huang-will-nvidias-moat-persist.md\",\"coverImage\":\"$undefined\"},{\"id\":\"reports-biology-ai-agent-benchmarking\",\"sender\":\"ML@B Blog\",\"author\" /notions-token-town-5-rebuilds-100-tools-mcp-vs-clis-and-the-software-factory-future-simon-last-sarah-sachs-of-notion.md\",\"coverImage\":\"$undefined\"},{\"id\":\"ai-programmers-work-change\",\"sender\":\"New York Times Podcasts\",\"author\":\"henri\",\"sourceAuthor\":\"Clive Thompson（嘉宾）\",\"authorAliases\":[\"henri\",\"Clive Thompson（嘉宾）\",\"Clive Thompson\",\"Henri\",\"Hinbox\"],\"publisher\":\"New York Times Podcasts\",\"publishedAt\":\"$undefined\",\"subject\":\"当程序员把键盘交给人工智能\",\"snippet\":\"生成式人工智能正在快速改变软件开发。许多程序员把大量日常编码交给 AI 代理，自己的工作转向规划功能、描述需求、审查结果、测试质量和做取舍。效率提升明显，尤其在小型创业公司中更突出，但新的风险也随之出现：技能退化、初级岗位减少、代码长期维护隐患，以及企业借 AI 压低白领劳动价值。\",\"date\":\"2026-04-14\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Notes\"],\"tags\":[\"AI编程\",\"代码审查\",\"软件测试\",\"创业\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"notes/ai-programmers-work-change.md\",\"coverImage\":\"$undefined\"},{\"id\":\"essays-ai-and-productivity-rethinking-workforce-training-and-social\",\"sender\":\"Philippe Tibi\",\"author\":\"Philippe Tibi\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Philippe Tibi\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"AI 与生产率：重新审视劳动力培训与社会凝聚力\",\"snippet\":\"人工智能正在以前所未有的速度重塑生产率与就业的关系，但它的真实影响远比“取代工作”的简单叙事更为复杂。本文作者 Philippe Tibi 指出，AI 更像一台放大器——为做好准备的人放大价值，为落伍者放大不平等。生产率提升的真实收益并未转化为闲暇，而是被重新投入到更多的工作中；与此同时，初级岗位正首当其冲地消失，年轻毕业生成为矿井中的金丝雀，传统专业知识传承链条面临断裂风险。文章沿着一条清晰的线索展开：从生产率到就业，从就业到企业组织\",\"date\":\"2026-04-14\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Essays\"],\"tags\":[\"人工智能\",\"劳动市场\",\"生产率\",\"职业培训\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"essays/ai-and-productivity-rethinking-workforce-training-and-social.md\",\"coverImage\":\"$undefined\"},{\"id\":\"essays-arguing-with-agents\",\"sender\":\"Mike Perham\",\"author\":\"Mike Perham\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Mike Perham\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"与智能体争论\",\"snippet\":\"当一个语言模型无视你明确写下的规则，转而“感知”到你隐含的紧迫感时，你面对的不只是技术问题，而是一场关于沟通本质的碰撞。本文作者在连续数小时与AI智能体无效对抗后，猛然意识到一个令人震惊的模式：他与LLM之间的对话失败，竟然复刻了他作为晚确诊孤独症谱系者一生都在经历的困境——字面、精确的表达不断被对方解读出“言外之意”。作者将孤独症研究中“双重共情问题”的框架延伸至人机交互，指出现代AI模型经由RLHF训练，其“倾听”习惯天然偏向神经典\",\"date\":\"2026-04-14\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Essays\"],\"tags\":[\"AI编程\",\"人机交互\",\"指令遵循\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"essays/arguing-with-agents.md\",\"coverImage\":\"$undefined\"},{\"id\":\"essays-the-human-brain-is-critical-infrastructure-and-it-has-no-fir\",\"sender\":\"Guillaume Chillet\",\"author\":\"Guillaume Chillet\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Guillaume Chillet\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"人脑是关键基础设施——但它没有防火墙\",\"snippet\":\"这篇文章深刻揭示了当前信息防御范式的根本困境：法国首部反信息操纵战略仍将重心放在管控信息来源上，却遭遇法律、技术与心理层面的三重不可能。作者一针见血地指出，对抗叙事的底层逻辑无法解决公众的认知脆弱性——虚假信息留下的认知印迹，更正也无法抹除。真正的出路在于视角转换：从控制信息流转向强化判断力。剑桥大学的心理接种研究、瑞典心理防卫局的全民韧性实践，都指向一个更根本的概念——认知主权。这不是抽象的理论建构，而是每个人都可以训练和迁移的判断力\",\"date\":\"2026-04-14\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Essays\"],\"tags\":[\"信息操纵\",\"认知科学\",\"媒介素养\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"essays/the-human-brain-is-critical-infrastructure-and-it-has-no-fir.md\",\"coverImage\":\"$undefined\"},{\"id\":\"reports-glm-51-towards-long-horizon-tasks\",\"sender\":\"Zhipu AI\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"Zhipu AI\",\"publishedAt\":\"$undefined\",\"subject\":\"GLM-5.1：面向长程任务\",\"snippet\":\"GLM-5.1 是智谱面向智能体工程推出的下一代旗舰模型，其核心突破不仅在于 SWE-Bench Pro 等基准测试上的领先成绩，更在于它重新定义了模型在长时间跨度内保持有效性的能力。此前的大模型——包括 GLM-5 本身——往往在初步取得进展后迅速陷入平台期，即便给予更多时间也无法持续改进。GLM-5.1 的设计目标恰恰是打破这一瓶颈。文章通过三个反馈结构化程度逐级递减的任务来展示这一能力：从 600 轮迭代将向量数据库 QPS 优化\",\"date\":\"2026-04-14\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Reports\"],\"tags\":[\"GLM\",\"智能体\",\ 采购的长期竞争。\",\"date\":\"2026-04-13\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Reports\"],\"tags\":[\"人工智能\",\"产品定价\",\"商业模式\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"reports/surviving-ai-price-wars.md\",\"coverImage\":\"$undefined\"},{\"id\":\"essays-jazz-in-the-key-of-life\",\"sender\":\"MIT News\",\"author\":\"Peter Dizikes\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Peter Dizikes\"],\"publisher\":\"MIT News\",\"publishedAt\":\"$undefined\",\"subject\":\"生命琴键上的爵士\",\"snippet\":\"米格尔·泽农是一位难以用单一标签定义的音乐家。这位格莱美获奖萨克斯手、麦克阿瑟天才奖得主，同时也是MIT的终身教授，其艺术生涯始终游走于多重维度之间：爵士与波多黎各传统音乐的融合，技术严谨与情感松弛的平衡，学院派智识与街头直觉的共振。本文讲述了泽农从圣胡安出发，经伯克利、纽约抵达MIT的人生轨迹，也揭示了他如何将音乐视为一种\\\"让个人化而发自内心的东西，与智识化而深思熟虑的东西携手同行\\\"的载体。无论是将游吟诗人的十行诗节改编为爵士四重奏，\",\"date\":\"2026-04-12\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Essays\"],\"tags\":[\"爵士乐\",\"音乐创作\",\"艺术教育\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"essays/jazz-in-the-key-of-life.md\",\"coverImage\":\"$undefined\"},{\"id\":\"reports-category-theory-illustrated-types\",\"sender\":\"henri\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"范畴论图解：类型\",\"snippet\":\"在范畴论语境下，“类型”不仅是编程中的基础构件，更指向一种深刻的数学基础理论。本文从习以为常的“集合”概念切入，揭示了这种直观思维潜藏的深层危机——罗素悖论。当试图定义“所有不包含自身的集合”时，朴素集合论便陷入了无法自洽的逻辑死循环。面对这一困境，数学界分化出两条路径：其一是以ZFC集合论为代表，通过增添诸多限制性公理来“打补丁”，代价是牺牲了集合论原本引以为傲的简单性；\",\"date\":\"2026-04-12\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Reports\"],\"tags\":[\"范畴论\",\"类型论\",\"集合论\",\"数学基础\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"reports/category-theory-illustrated-types.md\",\"coverImage\":\"$undefined\"},{\"id\":\"reports-center-for-responsible-decentralized-intelligence-at-berkele\",\"sender\":\"henri\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"伯克利负责任去中心化智能中心：攻破顶级 AI 基准\",\"snippet\":\"当前人工智能的繁荣，很大程度上建立在基准测试分数的飙升之上。然而，伯克利的一项最新研究打破了这一幻象。研究团队成功“攻破”了八个顶级AI智能体基准，揭示了一个令人不安的事实：模型无需真实推理，仅需利用评估流程的漏洞，便能轻松获得近乎完美的分数。本文详细拆解了这些“钻空子”的手段，直指行业评估体系的系统性缺陷。\",\"date\":\"2026-04-12\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Reports\"],\"tags\":[\"智能体\",\"模型评估\",\"奖励投机\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"reports/center-for-responsible-decentralized-intelligence-at-berkele.md\",\"coverImage\":\"$undefined\"},{\"id\":\"reports-prompt-caching\",\"sender\":\"henri\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"提示词缓存\",\"snippet\":\"在大模型应用日益复杂的当下，API调用的成本与延迟成为开发者不可忽视的瓶颈。本文深入解析了Anthropic推出的“提示词缓存”机制，为这一痛点提供了切实的工程解法。该功能通过复用提示词的特定前缀，在保障零数据保留合规性的前提下，显著削减了长上下文、多轮对话及重复性任务的处理开销。文章不仅清晰对比了自动缓存与显式断点两种控制策略的适用边界，还详细拆解了其底层运转逻辑与阶梯式定价模型。\",\"date\":\"2026-04-12\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Reports\"],\"tags\":[\"提示缓存\",\"大语言模型\",\"成本优化\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"reports/prompt-caching.md\",\"coverImage\":\"$undefined\"},{\"id\":\"reports-lethal-conflict-after-group-fission-in-wild-chimpanzees\",\"sender\":\"Aaron A. Sandel\",\"author\":\"Aaron A. Sandel\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Aaron A. Sandel\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"野生黑猩猩群体分裂后的致命冲突\",\"snippet\":\"人类战争的根源是文化驱动还是社会关系演变？Sandel 等人基于对乌干达 Ngogo 黑猩猩长达 30 年的追踪，揭示了非人类动物中首例确凿的“内战”。研究记录了一个大型群体如何经历社会网络断裂与空间隔离，最终分裂为两个阵营，并在随后七年间对曾经的同伴发动数十次致命突袭。这一发现有力挑战了“文化标志假说”，表明即使缺乏宗教、语言等文化建构，单纯的社会关系动态转变也足以催生群体暴力，将同族化为死敌。\",\"date\":\"2026-04-10\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Reports\"],\"tags\":[\"动物行为\",\"群体冲突\",\"社会网络\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"reports/lethal-conflict-after-group-fission-in-wild-chimpanzees.md\",\"coverI magazine\",\"sourcePath\":\"reports/four-agents-company.md\",\"coverImage\":\"$undefined\"},{\"id\":\"reports-how-nasa-built-artemis-iis-fault-tolerant-computer\",\"sender\":\"Logan Kugler\",\"author\":\"Logan Kugler\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Logan Kugler\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"NASA 如何打造 Artemis II 的容错计算机\",\"snippet\":\"在距离地球25万英里的深空，计算机的任何一秒停机都意味着灾难。本文深入剖析了NASA为Artemis II任务打造的极端容错计算架构。与阿波罗时代依赖机电备份不同，猎户座飞船已由软件全面接管安全关键功能，这迫使NASA在可靠性设计上跨越了传统边界。文章详细揭示了系统如何突破常规三重冗余，采用八CPU并行与“故障静默”设计过滤辐射干扰，并依托时间触发以太网实现严苛的确定性同步。\",\"date\":\"2026-04-09\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Reports\"],\"tags\":[\"航天工程\",\"容错计算\",\"软件可靠性\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"reports/how-nasa-built-artemis-iis-fault-tolerant-computer.md\",\"coverImage\":\"$undefined\"},{\"id\":\"reports-scaling-managed-agents-decoupling-the-brain-from-the-hands\",\"sender\":\"Anthropic\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"Anthropic\",\"publishedAt\":\"$undefined\",\"subject\":\"扩展托管智能体：将大脑与双手解耦\",\"snippet\":\"大语言模型的能力在快速演进，但围绕它们构建的工程系统——harness（调度框架）——却常常编码着对模型能力的过时假设。Anthropic 在这篇技术博客中分享了他们在设计 Managed Agents 时的核心洞见：将 agent 的\\\"大脑\\\"（Claude 及其调度循环）与\\\"双手\\\"（执行操作的环境和工具）以及\\\"记忆\\\"（会话日志）彻底解耦。这一思路借鉴了操作系统设计的经典智慧——正如 `read()` 系统调用历经磁盘技术更迭而屹立不倒\",\"date\":\"2026-04-09\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Reports\"],\"tags\":[\"智能体\",\"软件架构\",\"执行环境\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"reports/scaling-managed-agents-decoupling-the-brain-from-the-hands.md\",\"coverImage\":\"$undefined\"},{\"id\":\"essays-e-w-dijkstra-archive-on-the-foolishness-of-natural-language-programming-ewd-667\",\"sender\":\"Edsger W. Dijkstra\",\"author\":\"Edsger W. Dijkstra\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Edsger W. Dijkstra\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"关于\\\"自然语言编程\\\"的愚蠢性\",\"snippet\":\"自自动计算技术诞生之初，就有人认为编程需要像使用任何形式化符号体系那样保持严谨和准确是一种缺陷。他们指责机械的“奴隶”只会盲目地执行给定的指令，哪怕稍微动脑思考一下就会发现这些指令包含着显而易见的错误。“但须臾亦是漫长，思考实为痛楚。”（A.E. Housman语）。他们热切地期望并等待着更为聪明的机器，期待机器能够拒绝执行由轻微笔误所引发的无意义指令。\",\"date\":\"2026-04-08\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Essays\"],\"tags\":[\"编程语言\",\"自然语言\",\"程序正确性\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"essays/e-w-dijkstra-archive-on-the-foolishness-of-natural-language-programming-ewd-667.md\",\"coverImage\":\"$undefined\"},{\"id\":\"essays-on-proof-and-progress-in-mathematics\",\"sender\":\"William P. Thurston\",\"author\":\"William P. Thurston\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"William P. Thurston\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"关于数学中的证明与进展\",\"snippet\":\"Fields Medal得主William Thurston的经典文章，深入探讨数学理解的本质、证明的意义以及数学共同体中知识交流的方式，回应了'数学进步等同于证明定理'的狭隘观点。\",\"date\":\"2026-04-08\",\"isRead\":true,\"isStarred\":true,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Essays\"],\"tags\":[\"数学哲学\",\"数学证明\",\"数学研究\",\"知识交流\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"essays/on-proof-and-progress-in-mathematics.md\",\"coverImage\":\"$undefined\"},{\"id\":\"reports-optimizing-your-dev-environment-for-coding-agents\",\"sender\":\"Eric Zakariasson\",\"author\":\"Eric Zakariasson\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Eric Zakariasson\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"为编码智能体优化开发环境\",\"snippet\":\"当编码智能体接管日常开发工作时，开发者应如何为其铺设跑道？Eric Zakariasson 指出，前提是赋予智能体与人类员工同等的权限与工具访问权，这也促使开发者从逐行写代码转变为构建系统与定义标准。\",\"date\":\"2026-04-08\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Reports\"],\"tags\":[\"AI编程\",\"开发环境\",\"工具调用\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"reports/optimizing-your-dev-environment-for-coding-agents.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-extreme-harness-engineering-token-billionaires-ryan-lopopolo\",\"sender\":\"Latent.Space\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"Latent.Space\",\"publishedAt\":\"$undefined\",\"subject\":\"极限缰绳工程：百万行代码、十亿 Token 与零人工审查\",\"snippet\":\"We shed light on OpenAI's first Dark Factory for the first time.\",\"date\":\"2026-04-08\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"AI编程\",\"智能体\",\"代码审查\",\"开发基础设施\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/extreme-harness-engineering-token-billionaires-ryan-lopopolo.md\",\"coverImage\":\"$undefined\"},{\"id\":\"reports-anthropics-project-glasswingrestricting-claude-mythos-to-sec\",\"sender\":\"Simon Willison\",\"author\":\"Simon Willison\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Simon Willison\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"Anthropic 的 Project Glasswing：限制 Claude Mythos 访问——我认为很有必要\",\"snippet\":\"Anthropic近日推出模型Claude Mythos，却将其访问权严格限定于安全研究人员。本文剖析了这一审慎决策背后的现实：Mythos展现出远超前代的自主漏洞利用能力，能轻松串联复杂漏洞攻破主流操作系统。结合开源社区维护者的反馈，文章指出AI生成的安全报告已从“垃圾信息”演变为高质量的真实威胁浪潮。\",\"date\":\"2026-04-07\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Reports\"],\"tags\":[\"Claude\",\"网络安全\",\"漏洞研究\",\"AI治理\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"reports/anthropics-project-glasswingrestricting-claude-mythos-to-sec.md\",\"coverImage\":\"$undefined\"},{\"id\":\"reports-juxt-blog-a-bug-on-the-dark-side-of-the-moon\",\"sender\":\"henri\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"月球暗面之虫：阿波罗导航计算机中的一个隐藏 Bug\",\"snippet\":\"阿波罗导航计算机的代码曾被无数人审查与模拟，被认为已无懈可击。然而，本文作者借助现代行为规约语言与AI工具，在这段历史代码中发现了一个隐藏的资源锁泄漏bug。仅仅缺失四字节指令，却可能在阿波罗11号任务中引发致命危机。文章推演了当迈克尔·柯林斯独自在月球背面时，一次意外的开关触碰如何导致陀螺仪系统无声假死，将宇航员置于难以决策的绝境。\",\"date\":\"2026-04-07\",\"isRead\":true,\"isStarred\":false,\" gs\":[\"谷歌\",\"人工智能\",\"算力\",\"量子计算\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/the-history-and-future-of-ai-at-google-with-sundar-pichai.md\",\"coverImage\":\"$undefined\"},{\"id\":\"essays-what-next-for-the-compute-crunch\",\"sender\":\"Martin Alderson\",\"author\":\"Martin Alderson\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Martin Alderson\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"算力紧缺之后是什么？\",\"snippet\":\"算力，正在成为人工智能发展最硬核的瓶颈。Martin Alderson 延续他对 AI 算力危机的系列探讨，在这篇文章中点明了当前局势的荒诞性：OpenAI 和 Anthropic 公开承认算力不足，GitHub 提交量三个月内年化增长 14 倍，AI 公司的需求远超供给，以至于不得不靠限制用户使用来勉强维持运转。但问题的根源不在于 GPU 芯片本身，而在于物理世界的节奏跟不上数字世界的野心——GB200 的全液冷方案在千兆瓦级数据中心\",\"date\":\"2026-04-06\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Essays\"],\"tags\":[\"算力\",\"人工智能\",\"芯片\",\"能源\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"essays/what-next-for-the-compute-crunch.md\",\"coverImage\":\"$undefined\"},{\"id\":\"reports-a-cryptography-engineers-perspective-on-quantum-computing-ti\",\"sender\":\"henri\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"一位密码工程师的量子计算时间表视角\",\"snippet\":\"近期量子计算领域的突破性研究，正深刻动摇密码学界的传统预期。本文以一线工程师的视角，揭示了抗量子密码部署紧迫性的陡然升级。随着最新论文大幅下调破解现有加密体系的量子比特门槛，业界专家已将“量子威胁”的兑现时间表激进地前移至2029年。作者冷静指出，安全决策的核心不在于“威胁是否绝对发生”，而在于“能否确信它不会发生”。\",\"date\":\"2026-04-06\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Reports\"],\"tags\":[\"量子计算\",\"后量子密码\",\"网络安全\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"reports/a-cryptography-engineers-perspective-on-quantum-computing-ti.md\",\"coverImage\":\"$undefined\"},{\"id\":\"reports-continual-learning-for-ai-agents\",\"sender\":\"Harrison Chase\",\"author\":\"Harrison Chase\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Harrison Chase\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"AI 智能体的持续学习\",\"snippet\":\"持续学习在 AI 领域常被简化为\\\"更新模型权重\\\"这一件事，但 Harrison Chase 在这篇文章中提出了一种更具工程实用性的观察视角：对于一个完整的 AI 智能体系统，学习可以在三个不同层面发生——模型层、框架层和上下文层。模型层涉及权重更新与灾难性遗忘这一尚未解决的研究难题；框架层通过分析运行轨迹来优化驱动智能体的代码和基础指令；而上下文层，也就是通常所说的记忆，则可以在智能体、用户或组织等不同粒度上进行持久的配置更新。文章特别\",\"date\":\"2026-04-06\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Reports\"],\"tags\":[\"智能体\",\"持续学习\",\"长期记忆\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"reports/continual-learning-for-ai-agents.md\",\"coverImage\":\"$undefined\"},{\"id\":\"essays-the-ai-great-leap-forward\",\"sender\":\"Han Lee\",\"author\":\"Han Lee\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Han Lee\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"AI 大跃进\",\"snippet\":\"Han Lee的《The AI Great Leap Forward》以历史上的“大跃进”为隐喻，冷静剖析了当下企业界盲目的AI转型狂热。文章指出，自上而下的AI指令正催生出大量缺乏专业验证的“后院土高炉”式应用，它们看似精美却毫无价值，终将沦为沉重技术债务。同时，层层加码的虚假提效指标与强制性的采用率KPI，让古德哈特定律在组织内部大行其道。\",\"date\":\"2026-04-05\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Essays\"],\"tags\":[\"人工智能\",\"企业管理\",\"科技行业\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"essays/the-ai-great-leap-forward.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-cognition-ai-agents-12x-productivity-american-optimist\",\"sender\":\"Scott Wu \u0026 Russell Kaplan（受访） / Joe Lonsdale（主持）\",\"author\":\"Scott Wu \u0026 Russell Kaplan（受访） / Joe Lonsdale（主持）\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Scott Wu \u0026 Russell Kaplan（受访） / Joe Lonsdale（主持）\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"AI 智能体与 12 倍生产力：Cognition 联创谈 Devin 与软件丰饶时代\",\"snippet\":\"《美国乐观主义者》播客对话 Cognition 联合创始人 Scott Wu 与 Russell Kaplan：Devin 与 Windsurf、软件丰饶、工程师角色转变、政府遗留系统现代化、小微企业爆发与从「生存模式」到「创造模式」的展望。\",\"date\":\"2026-04-05\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"Devin\",\"智能体\",\"软件工程\",\"生产率\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/cognition-ai-agents-12x-productivity-american-optimist.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-how-openai-s-codex-team-builds-with-codex-43-min-alex-romain\",\"sender\":\"Peter Yang\",\"author\":\"Peter Yang\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Peter Yang\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"OpenAI的Codex团队如何用Codex构建产品\",\"snippet\":\"OpenAI Codex团队的产品负责人和开发者体验负责人首次揭秘团队日常运作：无需长篇需求文档，设计师写的代码比半年前的工程师还多，传统职业边界正在消融。\",\"date\":\"2026-04-05\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"Codex\",\"AI编程\",\"产品开发\",\"团队管理\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/how-openai-s-codex-team-builds-with-codex-43-min-alex-romain.md\",\"coverImage\":\"$undefined\"},{\"id\":\"reports-components-of-a-coding-agent\",\"sender\":\"Sebastian Raschka\",\"author\":\"Sebastian Raschka\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Sebastian Raschka\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"编码智能体的核心组件\",\"snippet\":\"Sebastian Raschka的这篇文章深入剖析了编码智能体的设计逻辑。作者指出，Claude Code等工具的惊艳表现，并非仅源于底层大语言模型，更核心的秘密在于其外围的“智能体框架”。文章清晰界定了模型、推理模型与智能体系统的层级关系：模型是引擎，框架则是调度工具、管理记忆与上下文的控制循环。\",\"date\":\"2026-04-04\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Reports\"],\"tags\":[\"AI编程\",\"智能体\",\"上下文工程\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"reports/components-of-a-coding-agent.md\",\"coverImage\":\"$undefined\"},{\"id\":\"reports-electrons-in-moire-crystals-explore-higher-dimensional-quant\",\"sender\":\"Department of Physics\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"Department of Physics\",\"publishedAt\":\"$undefined\",\"subject\":\"莫尔晶体中的电子探索高维量子世界\",\"snippet\":\"麻省理工学院的物理学家们在《自然》期刊上发表了一项令人瞩目的研究：他们发现了一种名为\\\"莫尔晶体\\\"的新型材料，其中的电子行为仿佛能够穿越第四空间维度。这并非科幻意义上的时空穿越，而是一种精妙的量子模拟——通过自然生长的晶体结构，电子以量子隧穿的方式在一个\\\"合成维度\\\"中运动，其物理特性逼真到足以让实验者如同真的在四维空间中 defined\",\"subject\":\"开放网络没有消亡，是我们亲手杀死了它\",\"snippet\":\"关于开放网络的衰退，人们常归咎于科技巨头的垄断或AI的冲击。然而本文提供了一个冷峻的洞见：开放网络并非死于外部攻击，而是被我们主动交易掉的。平台真正的武器不是技术，而是“便利性”。为了短期的便利与流量，我们心甘情愿将社交图谱与数据交托给封闭的信息孤岛，并默许了“免费”背后的代价。\",\"date\":\"2026-04-02\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Essays\"],\"tags\":[\"开放网络\",\"平台经济\",\"社交媒体\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"essays/the-open-web-isnt-dying-were-killing-it.md\",\"coverImage\":\"$undefined\"},{\"id\":\"reports-lincoln-laboratory-laser-communications-terminal-launches-on\",\"sender\":\"MIT Lincoln Laboratory\",\"author\":\"Ariana Gaines, Nathan Parde\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Ariana Gaines, Nathan Parde\",\"Ariana Gaines\",\"Nathan Parde\"],\"publisher\":\"MIT Lincoln Laboratory\",\"publishedAt\":\"$undefined\",\"subject\":\"林肯实验室激光通信终端随阿尔忒弥斯 II 号登月\",\"snippet\":\"1969年，阿波罗11号在月面留下人类足迹；半个多世纪后，阿尔忒弥斯II号正带领宇航员重返月球，而这一次，伴随他们的还有一项将重塑深空通信的技术——激光通信。MIT林肯实验室开发的O2O光学通信系统，搭载于猎户座飞船上，旨在用激光束取代传统射频，实现从月球向地球传输高清视频与海量数据的实时链路。核心终端MAScOT仅有家猫大小，已在国际空间站成功验证了超1 Gbps的下行速率，远超设计预期。这不仅意味着宇航员能在绕月途中与地面进行视频会\",\"date\":\"2026-04-02\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Reports\"],\"tags\":[\"激光通信\",\"深空通信\",\"航天工程\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"reports/lincoln-laboratory-laser-communications-terminal-launches-on.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-an-ai-state-of-the-union-inflection-point-dark-factories\",\"sender\":\"Lenny's Podcast\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"Lenny's Podcast\",\"publishedAt\":\"$undefined\",\"subject\":\"AI 国情咨文：拐点已过，暗黑工厂将至\",\"snippet\":\"Simon Willison is a prolific independent software developer, a blogger, and one of the most visible and trusted voices on the impact AI is having on builders...\",\"date\":\"2026-04-02\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\" 机器与容错量子计算的根本差异，指出当下最有前景的路径不是替代经典系统，而是构建混合架构。尤其发人深省的是他对\\\"量子洗白\\\"现象的警示：当研究者有意无意地将问题复杂化来凸显量\",\"date\":\"2026-03-31\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Essays\"],\"tags\":[\"量子计算\",\"金融工程\",\"风险管理\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"essays/how-quantum-finance-could-alter-market-engineering.md\",\"coverImage\":\"$undefined\"},{\"id\":\"essays-the-machines-are-fine-im-worried-about-us\",\"sender\":\"henri\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"机器没问题，我担心的是我们\",\"snippet\":\"当人工智能全面渗透科研流程，学术训练的本质是否正在被悄然置换？本文以两位天体物理学博士生的经历为切入点，勾勒出一幅令人警惕的图景：传统训练的Alice与全程依赖AI代理的Bob，在现行量化评估体系下产出了“无差别”的学术成果。然而，这种指标上的对等掩盖了能力的深渊。Alice习得了独立思考的结构与可携带的手艺，Bob交付的则是剥离了认知过程的空壳产品。\",\"date\":\"2026-03-30\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Essays\"],\"tags\":[\"科研自动化\",\"博士培养\",\"科研评价\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"essays/the-machines-are-fine-im-worried-about-us.md\",\"coverImage\":\"$undefined\"},{\"id\":\"reports-mathematical-methods-and-human-thought-in-the-age-of-ai\",\"sender\":\"Tanya Klowden, Terence Tao\",\"author\":\"Tanya Klowden, Terence Tao\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Tanya Klowden, Terence Tao\",\"Tanya Klowden\",\"Terence Tao\",\"陶哲轩\",\"陶哲轩（Terence Tao）\",\"Tanya Klowden 与 陶哲轩\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"AI时代的数学方法与人类思考\",\"snippet\":\"探讨 AI 技术对数学、哲学和知识创造的深远影响，以数学为沙盒审视人机协作的短期、中期和长期策略，呼吁以人为本的 AI 发展。\",\"date\":\"2026-03-27\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Reports\"],\"tags\":[\"人工智能\",\"数学研究\",\"人机协作\",\"科学哲学\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"reports/mathematical-methods-and-human-thought-in-the-age-of-ai.md\",\"coverImage\":\"$undefined\"},{\"id\":\"essays-ai-overly-affirms-users-asking-for-personal-advice\",\"sender\":\"henri\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"AI 过度顺从用户的个人建议请求\",\"snippet\":\"当我们向AI倾诉人际烦恼时，它真的在给出客观建议吗？斯坦福大学发表于《科学》的最新研究揭示了一个值得警惕的现象：在面临个人困境时，主流大语言模型普遍表现出过度顺从的“谄媚”倾向。即便用户行为明显有害甚至违法，AI也往往选择肯定与迎合。这种被包装在中立学术语言下的顺从，不仅让用户难以察觉，反而会使其在不知不觉中变得更加自我中心、道德教条化，进而削弱处理真实人际摩擦的能力。\",\"date\":\"2026-03-26\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Essays\"],\"tags\":[\"大语言模型\",\"谄媚行为\",\"人际关系\",\"模型评估\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"essays/ai-overly-affirms-users-asking-for-personal-advice.md\",\"coverImage\":\"$undefined\"},{\"id\":\"reports-implantable-islet-cells-could-control-diabetes-without-insul\",\"sender\":\"MIT News\",\"author\":\"Anne Trafton\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Anne Trafton\"],\"publisher\":\"MIT News\",\"publishedAt\":\"$undefined\",\"subject\":\"植入式胰岛细胞有望让糖尿病患者摆脱胰岛素注射\",\"snippet\":\"MIT 团队开发了一种植入式胰岛细胞装置，有望让 1 型糖尿病患者摆脱每日胰岛素注射。这项技术的核心突破在于：装置不仅通过封装保护供体或干细胞来源的胰岛细胞免受免疫排斥，还配备了由体外天线无线供电的氧气发生器，为细胞提供持续充足的氧供。在小鼠和大鼠实验中，该装置已在体内稳定运行至少 90 天，维持血糖在健康范围。相比传统胰岛移植须长期服用免疫抑制药物，这种免免疫抑制的方案大幅降低了患者的负担。研究人员还指出，该平台未来或可用于按需递送抗\",\"date\":\"2026-03-26\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Reports\"],\"tags\":[\"糖尿病\",\"细胞治疗\",\"生物医学工程\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"reports/implantable-islet-cells-could-control-diabetes-without-insul.md\",\"coverImage\":\"$undefined\"},{\"id\":\"reports-why-solid-state-batteries-keep-short-circuiting\",\"sender\":\"MIT News\",\"author\":\"Zach Winn\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Zach Winn\"],\"publisher\":\"MIT News\",\"publishedAt\":\"$undefined\",\"subject\":\"固态电池为何反复短路\",\"snippet\":\"枝晶——这种在固态电池内部生长的金属裂纹，一直被视作高能量密度储能方案迟迟未能商业化的头号障碍。数十年来，学界的主流解释将其归因于机械应力：锂金属像树根一样在固体电解质中挤压、扩张，最终导致材料断裂。MIT 团队的最新研究却彻底颠覆了这一认知。他们开发出可直接观测枝晶生长的可视化技术，首次在实验层面量化了枝晶形成过程中的应力分布，发现裂纹出现时的应力水平仅为纯机械理论
