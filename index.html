ch 2025主题演讲\",\"snippet\":\"黄仁勋在2025年VivaTech巴黎GTC上发表主题演讲，系统阐述AI计算的演进路径。演讲涵盖CUDA生态扩展、Blackwell架构与AI工厂概念、量子计算协同、从感知智能到智能体AI的三波浪潮，以及NVIDIA在欧洲的战略布局，包括主权大语言模型支持、工业数字孪生、自动驾驶和人形机器人等前沿领域的发展蓝图。\",\"date\":\"2025-06-11\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"GPU\",\"CUDA\",\"AI基础设施\",\"智能体\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/nvidia-jensen-huang-gtc-paris-vivatech-2025-keynote.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-cursor-building-future-ai-coding-with-claude\",\"sender\":\"Anthropic\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"Anthropic\",\"publishedAt\":\"$undefined\",\"subject\":\"Cursor如何利用Claude构建AI编码的未来\",\"snippet\":\"Anthropic与Cursor核心团队的深度访谈，探讨AI编程工具Cursor的快速增长历程、Claude模型如何推动产品从Tab自动补全演进到多文件编辑和后台代理功能，以及AI在大型代码库理解、软件验证、代码演变和工程师角色转变等方面带来的挑战与机遇。\",\"date\":\"2025-06-10\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"Cursor\",\"Claude\",\"AI编程\",\"代码生成\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/cursor-building-future-ai-coding-with-claude.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-ilya-sutskever-university-of-toronto-commencement-speech\",\"sender\":\"Ilya Sutskever\",\"author\":\"Ilya Sutskever\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Ilya Sutskever\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"Ilya Sutskever 多伦多大学毕业典礼演讲\",\"snippet\":\"Ilya Sutskever 在多伦多大学毕业典礼上发表演讲，强调我们正处于AI驱动的前所未有的时代。他认为AI终将能完成人类所有工作，因为大脑本质上是生物计算机，数字计算机没有理由做不到同样的事。他建议每个人接受现实、密切关注AI发展、积聚能量应对未来挑战，并指出这是人类有史以来面临的最大挑战，也蕴含着最大的回报。\",\"date\":\"2025-06-09\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"通用人工智能\",\"超级智能\",\"科技伦理\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/ilya-sutskever-university-of-toronto-commencement-speech.md\",\"coverImage\":\"$undefined\"},{\"id\":\"writing-rules-steven-pinker\",\"sender\":\"henri\",\"author\":\"henri\",\"sourceAuthor\":\"David Perell\",\"authorAliases\":[\"henri\",\"David Perell\",\"Henri\",\"Hinbox\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"写作的核心规则：让读者真的看见你的意思\",\"snippet\":\"史蒂芬·平克把糟糕写作的根源放在知识的诅咒上：作者太熟悉自己的领域，忘了读者并不共享那些背景、术语和默认前提。清楚的写作要进入读者的处境，用具体画面替代空泛抽象，用例子支撑概括，用删减降低理解成本。AI 写作虽然句法顺畅，却容易变得平庸，因为它常把个体经验和风格磨平。\",\"date\":\"2025-06-04\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Notes\"],\"tags\":[\"写作\",\"认知科学\",\"表达方法\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"notes/writing-rules-steven-pinker.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-claude-code-conversation\",\"sender\":\"Alex Albert, Boris Cherny\",\"author\":\"Alex Albert, Boris Cherny\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Alex Albert, Boris Cherny\",\"Alex Albert\",\"Boris Cherny\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"关于Claude Code的对话\",\"snippet\":\"本文整理了Anthropic公司Claude关系主管Alex Albert与Claude Code创造者Boris Cherny的深度访谈。内容涵盖Claude Code的起源故事、安装使用方法、代理式编程的核心体验、编程范式从打孔卡到提示词的演进、Claude 4模型带来的能力提升，以及任务规划和Claude.md文件等实用技巧，为开发者提供了一份兼具宏观视角与微观操作的详实指南。\",\"date\":\"2025-06-04\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"Claude Code\",\"AI编程\",\"开发工具\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/claude-code-conversation.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-harvard-professor-explains-rules-of-writing-steven-pinker\",\"sender\":\"David Perell\",\"author\":\"David Perell\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"David Perell\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"哈佛教授讲写作规则：史蒂文·平克\",\"snippet\":\"本文整理 Steven Pinker 关于写作认知机制的访谈，讨论“知识诅咒”、表达清晰度与 AI 时代非虚构写作方法。\",\"date\":\"2025-06-04\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"写作\",\"认知科学\",\"科学传播\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/harvard-professor-explains-rules-of-writing-steven-pinker.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-code-with-claude-opening-keynote\",\"sender\":\"Anthropic\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"Anthropic\",\"publishedAt\":\"$undefined\",\"subject\":\"Code with Claude 开幕主题演讲\",\"snippet\":\"Anthropic 首届开发者大会 Code with Claude 的开幕主题演讲完整记录。会上正式发布了 Claude 4 Opus 和 Claude 4 Sonnet 两款旗舰模型，介绍了代码执行工具、文件 API、提示词缓存等平台更新，演示了 Claude Code 与主流 IDE 的深度集成及 SDK，并与 GitHub 宣布深化合作。演讲后半部分围绕 AI 未来走向、安全与可解释性等议题展开对话。\",\"date\":\"2025-05-22\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"Claude\",\"Claude Code\",\"MCP\",\"AI编程\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/code-with-claude-opening-keynote.md\",\"coverImage\":\"$undefined\"},{\"id\":\"essays-fooled-by-ai-for-science-hype-lessons-learned\",\"sender\":\"Nick McGreivy\",\"author\":\"Nick McGreivy\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Nick McGreivy\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"我被人工智能助力科学的炒作给骗了——这是它给我的教训\",\"snippet\":\"普林斯顿大学物理学博士Nick McGreivy分享了他在等离子体物理研究中应用AI求解偏微分方程的亲身经历。他发现物理信息神经网络等AI方法远不如宣传的那样有效，与传统数值方法公平对比后优势几乎消失。他进而指出AI助力科学领域普遍存在幸存者偏差、不公平比较和过度乐观等问题，认为AI更可能是一种渐进式工具而非革命性突破。\",\"date\":\"2025-05-19\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Essays\"],\"tags\":[\"科学计算\",\"偏微分方程\",\"人工智能\",\"可复现研究\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"essays/fooled-by-ai-for-science-hype-lessons-learned.md\",\"coverImage\":\"$undefined\"},{\"id\":\"essays-peter-lax-cold-war-mathematician-dies-at-99\",\"sender\":\"迈克尔·J·巴拉尼, 布里特·希尔兹\",\"author\":\"迈克尔·J·巴拉尼, 布里特·希尔兹\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"迈克尔·J·巴拉尼, 布里特·希尔兹\",\"迈克尔·J·巴拉尼\",\"布里特·希尔兹\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"彼得·拉克斯，杰出的冷战数学家，逝世，享年99岁\",\"snippet\":\"匈牙利裔美国数学家彼得·拉克斯于2025年5月16日在曼哈顿家中逝世，享年99岁。他在偏微分方程理论与应用领域做出了开创性贡献，曾参与曼哈顿计划，推动了超级计算在科学工程中的广泛应用，并于2005年成为首位获得阿贝尔奖的应用数学家，被誉为他那一代最具全能性的数学家。\",\"date\":\"2025-05-16\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Essays\"],\"tags\":[\"偏微分方程\",\"计算数学\",\"数学史\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"essays/peter-lax-cold-war-mathematician-dies-at-99.md\",\"coverImage\":\"$undefined\"},{\"id\":\"essays-how-to-do-research-at-mit-ai-lab\",\"sender\":\"David Chapman\",\"author\":\"David Chapman\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"David Chapman\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"MIT人工智能实验室如何做研究\",\"snippet\":\"本文由MIT人工智能实验室研究生共同编写，系统介绍了如何开展AI研究工作。内容涵盖阅读技巧、论文写作、编程实践、导师选择、课题确定、研究方法论以及心理调整等方面，为研究生提供了一套从入门到深入的实用建议与启发式方法，帮助研究者掌握必要技能并享受研究过程。\",\"date\":\"2025-05-06\",\"isRead\":true,\"isStarred\":true,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Essays\"],\"tags\":[\"人工智能\",\"研究方法\",\"博士培养\",\"学术写作\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"essays/how-to-do-research-at-mit-ai-lab.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-berkshire-hathaway-annual-shareholder-meeting-2025\",\"sender\":\"henri\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"伯克希尔哈撒韦公司年度股东大会实录-2025\",\"snippet\":\"2025年伯克希尔哈撒韦年度股东大会上，巴菲特宣布年底将CEO职位正式交接给格雷格·阿贝尔，同时就公司创纪录的现金储备、投资策略、GEICO复苏、能源业务挑战及美国财政赤字等议题发表了深入见解，涵盖投资理念、风险管理与领导层传承等核心内容。\",\"date\":\"2025-05-03\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"价值投资\",\"企业传承\",\"保险\",\"财政政策\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/berkshire-hathaway-annual-shareholder-meeting-2025.md\",\"coverImage\":\"$undefined\"},{\"id\":\"essays-whitesides-group-writing-a-paper\",\"sender\":\"George M. Whitesides\",\"author\":\"George M. Whitesides\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"George M. Whitesides\",\"乔治·M·怀特塞兹（George M. Whitesides）\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"怀特塞兹研究组：撰写论文\",\"snippet\":\"本文是哈佛大学化学家怀特塞兹撰写的经典学术写作指南，系统阐述了科学论文的本质、提纲驱动的写作方法以及写作风格要点。文章强调论文不仅是研究成果的归档工具，更是规划和组织研究的框架，主张从项目早期就开始围绕数据构建提纲，并通过反复迭代修改来高效完成论文写作。\",\"date\":\"2025-05-02\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Essays\"],\"tags\":[\"学术写作\",\"研究方法\",\"科学传播\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"essays/whitesides-group-writing-a-paper.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-yc-interview-windsurf-ceo-ai-agents-pivot-future-of-coding\",\"sender\":\"Varun Mohan\",\"author\":\"Varun Mohan\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Varun Mohan\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"YC访谈Windsurf CEO — 押注AI Agents、48小时转型，以及编码的未来\",\"snippet\":\"Windsurf联合创始人兼CEO Varun Mohan在YC访谈中回顾了公司从GPU虚拟化业务Exofunction出发，在一个周末内果断转型投身AI辅助编程领域的历程。访谈深入探讨了自研模型训练、代码上下文理解、RAG优化等技术突破，以及从VS Code扩展演进为独立IDE的战略考量，并分享了对AI Agent发展、软件开发民主化和开发者角色演变的前沿洞察。\",\"date\":\"2025-05-02\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"Windsurf\",\"AI编程\",\"智能体\",\"创业\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/yc-interview-windsurf-ceo-ai-agents-pivot-future-of-coding.md\",\"coverImage\":\"$undefined\"},{\"id\":\"essays-why-models-think\",\"sender\":\"Lilian Weng\",\"author\":\"Lilian Weng\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Lilian Weng\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"模型为何思考\",\"snippet\":\"本文系统回顾了大语言模型在推理时如何通过额外计算提升性能的最新进展。从心理学双系统理论类比出发，探讨了思维链prompting、并行采样、序列修订等关键技术，分析了将计算视为资源和潜在变量建模两种理论视角，并梳理了从早期CoT到o1、R1等推理模型的发展脉络。\",\"date\":\"2025-05-01\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Essays\"],\"tags\":[\"推理时计算\",\"思维链\",\"强化学习\",\"大语言模型\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"essays/why-models-think.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-rise-of-cursor-lenny-podcast-michael-truell-interview\",\"sender\":\"Michael Truell\",\"author\":\"Michael Truell\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Michael Truell\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"Cursor的崛起——Lenny播客Michael Truell访谈\",\"snippet\":\"Anysphere联合创始人兼CEO Michael Truell做客Lenny播客，分享AI代码编辑器Cursor从零到3亿美元ARR的崛起历程。访谈涵盖Cursor的起源故事、从CAD自动化转向编程自动化的战略转型、对代码之后世界的构想、自研定制模型的技术决策、团队招聘经验，以及对未来工程师技能演变和AI编码工具市场格局的深度思考。\",\"date\":\"2025-05-01\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"Cursor\",\"AI编程\",\"代码编辑器\",\"创业\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/rise-of-cursor-lenny-podcast-michael-truell-interview.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-how-to-get-the-most-out-of-vibe-coding\",\"sender\":\"Tom (YC 合伙人)\",\"author\":\"Tom (YC 合伙人)\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Tom (YC 合伙人)\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"如何充分利用 Vibe Coding | 创业学校讲座实录\",\"snippet\":\"YC 合伙人 Tom 分享了 Vibe Coding 的实用技巧与最佳实践，涵盖工具选择、项目规划、版本控制、测试驱动、调试策略、指令编写和文档管理等方面。多位 YC X25 批次创始人也贡献了各自的经验，包括同时使用多个 AI IDE、以测试用例为先导、以及在纯 LLM 环境中预先规划架构等方法，帮助开发者更高效地利用 AI 编码工具构建产品。\",\"date\":\"2025-04-25\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"AI编程\",\"开发工作流\",\"版本控制\",\"软件测试\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/how-to-get-the-most-out-of-vibe-coding.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-kevin-kelly-predicting-the-future-after-40-years-in-tech\",\"sender\":\"Kevin Kelly, Dan Shipper\",\"author\":\"Kevin Kelly, Dan Shipper\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Kevin Kelly, Dan Shipper\",\"Kevin Kelly\",\"Dan Shipper\",\"凯文·凯利（Kevin Kelly）与丹·希珀（Dan Shipper）\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"凯文·凯利：科技四十年之后，如何理解与预测未来\",\"snippet\":\"凯文·凯利与丹·希珀谈文学、技术前沿与历史、智能的多样性、AI 辅助创作，以及他对 VR、比特币和 eBay 的误判：预测未来需要好奇心，也需要承认自己会错。\",\"date\":\"2025-04-24\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"人工智能\",\"未来预测\",\"科技史\",\"内容创作\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/kevin-kelly-predicting-the-future-after-40-years-in-tech.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-why-we-stopped-progressing-peter-thiel-ep541\",\"sender\":\"Jordan B. Peterson, Peter Thiel\",\"author\":\"Jordan B. Peterson, Peter Thiel\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Jordan B. Peterson, Peter Thiel\",\"Jordan B. Peterson\",\"Peter Thiel\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"为何我们停止进步\",\"snippet\":\"心理学家乔丹·彼得森与投资家彼得·蒂尔深度对话，围绕蒂尔的核心观点展开——自20世纪70年代以来，人类在物质世界的科技进步显著放缓，仅在数字领域持续发展。两人探讨了导致停滞的多重原因，包括核武器带来的末日恐惧、社会风险规避、过度监管，以及从外部探索转向内心体验的文化变迁，并借助吉拉尔的模仿理论剖析竞争与暴力的深层动力。\",\"date\":\"2025-04-24\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"科技发展\",\"文化\",\"科学哲学\",\"宗教\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/why-we-stopped-progressing-peter-thiel-ep541.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-geoffrey-hinton-three-tips-for-incoming-students\",\"sender\":\"Rahul Kalvapalle\",\"author\":\"Rahul Kalvapalle\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Rahul Kalvapalle\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"追随你的好奇心——杰弗里·辛顿为新生提供三点建议\",\"snippet\":\"诺贝尔物理学奖得主、多伦多大学荣誉教授杰弗里·辛顿在一场面向准新生的直播活动中，结合自身曲折的学术经历，分享了三条核心建议——让好奇心引领方向、接受非线性的成长路径、找到适合自己的学习方式，并与神经科学家伍丁院长共同探讨了人工智能的未来及大学生活中的探索与成长。\",\"date\":\"2025-04-22\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"科研生涯\",\"高等教育\",\"好奇心\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/geoffrey-hinton-three-tips-for-incoming-students.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-lebron-james-routine-in-detail-mind-the-game\",\"sender\":\"Mind the Game\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"Mind the Game\",\"publishedAt\":\"$undefined\",\"subject\":\"Mind the Game — 勒布朗·詹姆斯的日常细节\",\"snippet\":\"本文基于勒布朗·詹姆斯与史蒂夫·纳什在 Mind the Game 节目中的深度对话，详细解析了詹姆斯进入NBA第22个赛季仍保持顶尖竞技状态的秘密。内容涵盖其休赛期恢复策略、赛季日常编排、睡眠与营养管理、技术打磨与战术适应，以及他所信奉的过程重于结果的核心理念。\",\"date\":\"2025-04-18\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"NBA\",\"体育训练\",\"运动恢复\",\"职业发展\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/lebron-james-routine-in-detail-mind-the-game.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-jamie-dimon-ft-interview-us-china-relations\",\"sender\":\"Roula Khalaf\",\"author\":\"Roula Khalaf\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Roula Khalaf\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"Jamie Dimon FT 访谈-中美关系\",\"snippet\":\"金融时报编辑 Roula Khalaf 与摩根大通 CEO 杰米·戴蒙在纽约总部进行深度对话，围绕中美关系、全球联盟体系、美国经济与市场波动、关税政策影响等核心议题展开讨论。戴蒙主张美国应与盟友协作而非孤立行事，呼吁中美恢复高层对话，并就西方世界团结、贸易公平性及企业战略分享了深刻见解。\",\"date\":\"2025-04-15\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"中美关系\",\"国际贸易\",\"银行业\",\"关税政策\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/jamie-dimon-ft-interview-us-china-relations.md\",\"coverImage\":\"$undefined\"},{\"id\":\"reports-google-prompt-engineering-whitepaper\",\"sender\":\"Lee Boonstra\",\"author\":\"Lee Boonstra\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Lee Boonstra\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"Google 官方提示工程白皮书\",\"snippet\":\"这份由Google发布的提示工程白皮书系统介绍了大语言模型的提示设计方法。内容涵盖LLM输出配置、零样本与少样本提示、思维链推理、ReAct等多种提示技巧，并深入探讨代码提示和多模态提示的应用场景，最后给出了一系列实用的最佳实践建议，帮助读者从入门到精通掌握提示工程。\",\"date\":\"2025-04-10\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Reports\"],\"tags\":[\"提示工程\",\"大语言模型\",\"思维链\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"reports/google-prompt-engineering-whitepaper.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-nvidia-gtc-2025-yann-lecun-bill-dally-conversation-ai-frontiers\",\"sender\":\"henri\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"NVIDIA GTC 2025 AI与计算前沿 - Yann LeCun与Bill Dally对话\",\"snippet\":\"Meta首席AI科学家Yann LeCun在NVIDIA GTC 2025上与Bill Dally展开对话，对当前大型语言模型热潮持审慎态度，认为LLM并非通向真正机器智能的终点。他提出未来研究应聚焦四大方向——理解物理世界、持久记忆、推理与规划，并介绍了联合嵌入预测架构JEPA作为替代方案，同时倡导开源战略推动AI多样化发展。\",\"date\":\"2025-04-10\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"世界模型\",\"JEPA\",\"大语言模型\",\"开源\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/nvidia-gtc-2025-yann-lecun-bill-dally-conversation-ai-frontiers.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-openai-gpt-4-5-pretraining-deep-dive\",\"sender\":\"Sam Altman, Alex Paino, Amin Tootoonchian, Daniel Selsam\",\"author\":\"Sam Altman, Alex Paino, Amin Tootoonchian, Daniel Selsam\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Sam Altman, Alex Paino, Amin Tootoonchian, Daniel Selsam\",\"Sam Altman\",\"Alex Paino\",\"Amin Tootoonchian\",\"Daniel Selsam\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"深度揭秘GPT-4.5预训练：Scaling Laws的极限探索与系统工程挑战\",\"snippet\":\"OpenAI内部访谈深入回顾了GPT-4.5的预训练全过程。团队以实现10倍智能提升为目标，经历了长达两年的研发，涉及ML与系统团队的深度协同设计、多集群训练中的硬件故障应对、大规模调试困境，以及从计算受限向数据受限的关键转变。访谈验证了Scaling Laws的持续有效性，并揭示了数据效率和容错机制等未来核心挑战。\",\"date\":\"2025-04-10\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"预训练\",\"计算规模\",\"样本效率\",\"系统工程\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/openai-gpt-4-5-pretraining-deep-dive.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-new-era-generalist-robotics-humanoids-nvidia-gtc-2025\",\"sender\":\"henri\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"通用机器人的新时代\",\"snippet\":\"本文整理自NVIDIA GTC 2025专题讨论，汇集1X、Skild AI、Agility Robotics、Boston Dynamics及NVIDIA等领先机器人公司负责人的观点。围绕人形机器人加速发展的驱动力、通用机器人大脑的构建策略、数据获取与仿真技术革新、跨实体泛化等核心挑战，以及从专用任务走向通用智能的未来图景展开深入探讨。\",\"date\":\"2025-04-08\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"人形机器人\",\"具身智能\",\"基础模型\",\"仿真\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/new-era-generalist-robotics-humanoids-nvidia-gtc-2025.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-git-20th-anniversary-linus-torvalds-interview\",\"sender\":\"Linus Torvalds\",\"author\":\"Linus Torvalds\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Linus Torvalds\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"Git 诞生二十周年访谈\",\"snippet\":\"在 Git 诞生近二十周年之际，创建者 Linus Torvalds 回顾了 Git 的起源与发展历程。他讲述了因 BitKeeper 许可危机而决定自行开发 Git 的经过，阐述了性能、数据完整性和分布式设计等核心理念，并分享了将维护权移交给 Junio Hamano 的考量，以及对 Git 未来挑战的思考。\",\"date\":\"2025-04-07\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"Git\",\"版本控制\",\"开源\",\"计算机史\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/git-20th-anniversary-linus-torvalds-interview.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-tariffs-eu-capital-markets-and-tuna-investment\",\"sender\":\"Bloomberg Television\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"Bloomberg Television\",\"publishedAt\":\"$undefined\",\"subject\":\"关税、欧盟资本市场与金枪鱼投资\",\"snippet\":\"彭博华尔街周刊2025年4月5日访谈节目整理。前美国财政部长萨默斯深入分析特朗普关税政策对美国经济的冲击与衰退风险，桑坦德银行主席博坦探讨欧盟资本市场一体化改革的紧迫性，节目实地探访墨西哥蓝鳍金枪鱼养殖企业展示私募股权如何改造传统产业，前美联储副主席夸尔斯则阐述放松金融管制促进经济增长的具体建议。\",\"date\":\"2025-04-04\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"关税政策\",\"资本市场\",\"私募股权\",\"金融监管\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/tariffs-eu-capital-markets-and-tuna-investment.md\",\"coverImage\":\"$undefined\"},{\"id\":\"essays-why-i-stopped-using-ai-code-editors\",\"sender\":\"Luciano Nooijen\",\"author\":\"Luciano Nooijen\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Luciano Nooijen\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"为什么我停止使用 AI 代码编辑器\",\"snippet\":\"作者分享了自己从代码编辑器中移除所有AI集成工具的原因。通过与特斯拉自动驾驶的类比，他发现长期依赖AI工具导致基础编程能力退化和技术直觉丧失。他主张将AI作为独立于编辑器的辅助工具，手动管理上下文，保持较高的使用门槛，以避免过度依赖。文章建议开发者坚持练习基础技能，不要让AI替代自身思考。\",\"date\":\"2025-04-01\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Essays\"],\"tags\":[\"AI编程\",\"代码编辑器\",\"技能退化\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"essays/why-i-stopped-using-ai-code-editors.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-mind-the-game-s2-lebron-nash-luka-longevity-love-of-game\",\"sender\":\"henri\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"Mind the Game 第二季 勒布朗·詹姆斯与史蒂夫·纳什谈卢卡·东契奇、生涯长度与对比赛的热爱\",\"snippet\":\"Mind the Game 第二季首期节目中，勒布朗·詹姆斯与新搭档史蒂夫·纳什围绕职业生涯长青秘诀、过程优于结果的理念展开深度对话，并以湖人中期交易得到卢卡·东契奇为情境，剖析了重磅交易带来的战术重塑、角色适应、阵容潜力与防守策略调整等核心议题，展现了两位篮球思想家对比赛的深刻理解。\",\"date\":\"2025-04-01\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"NBA\",\"篮球战术\",\"职业发展\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/mind-the-game-s2-lebron-nash-luka-longevity-love-of-game.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-naval-ravikant-harsh-truths-human-nature\",\"sender\":\"Chris Williamson\",\"author\":\"Chris Williamson\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Chris Williamson\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"人性的残酷真相 - Naval Ravikant 访谈录\",\"snippet\":\"本文是企业家与思想家纳瓦尔·拉维坎特与播客主持人克里斯·威廉姆森的深度对话实录。内容围绕成功与幸福的辩证关系、欲望管理、自尊建立、地位游戏的本质、生活原则与重大决策框架展开，同时涉及财富运用、育儿理念、社会文化观察及人工智能等议题，贯穿对心智自由与生活自由的追求。\",\"date\":\"2025-03-31\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"幸福\",\"自我认知\",\"人生哲学\",\"决策方法\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/naval-ravikant-harsh-truths-human-nature.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-charles-barkley-dan-patrick-show-interview-2025\",\"sender\":\"Dan Patrick Show\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"Dan Patrick Show\",\"publishedAt\":\"$undefined\",\"subject\":\"查尔斯·巴克利访谈录 - Dan Patrick Show\",\"snippet\":\"查尔斯·巴克利做客丹·帕特里克秀，围绕NCAA疯狂三月锦标赛展开讨论，高度评价新星库珀·弗拉格但反对与NBA球员类比，猛烈批评NCAA在NIL和转会门户政策上的混乱管理，预测大学体育将走向精英化。同时点评NBA总冠军争夺格局，并深入分析勒布朗与斯蒂芬·A·史密斯的公开冲突。\",\"date\":\"2025-03-28\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"篮球\",\"NBA\",\"大学体育\",\"体育管理\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/charles-barkley-dan-patrick-show-interview-2025.md\",\"coverImage\":\"$undefined\"},{\"id\":\"ai-writing-new-rules\",\"sender\":\"henri\",\"author\":\"henri\",\"sourceAuthor\":\"David Perell\",\"authorAliases\":[\"henri\",\"David Perell\",\"Henri\",\"Hinbox\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"AI时代，写作如何保住人的位置\",\"snippet\":\"AI正在改变写作的生产方式，也在重新抬高作家的门槛。普通信息整理、研究报告、润色和初稿生成会越来越便宜，但个人经验、专业判断、独特视角、品味和真实声音仍然有价值。写作者真正要做的，是把AI当作研究员、编辑和思考伙伴，同时把自己无法被模型复制的部分写出来。\",\"date\":\"2025-03-27\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Notes\"],\"tags\":[\"AI写作\",\"写作\",\"创作\",\"个人经验\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"notes/ai-writing-new-rules.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-satya-nadella-2025-leadership-innovation-future\",\"sender\":\"Madrona Ventures\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"auth e\":\"magazine\",\"sourcePath\":\"talks/elon-musk-tesla-q1-meeting-2025.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-michael-sandel-pku-lecture-critique-of-meritocracy\",\"sender\":\"迈克尔·桑德尔\",\"author\":\"迈克尔·桑德尔\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"迈克尔·桑德尔\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"迈克尔·桑德尔北大讲座——对优绩主义的批判性反思\",\"snippet\":\"哈佛大学教授迈克尔·桑德尔在北京大学全球教席系列讲座中，围绕优绩主义的暴政展开批判性反思。他指出优绩主义在实践中加剧社会不平等，催生成功者的傲慢与失败者的羞辱，并对赢家自身也造成焦虑与迷茫。讲座还通过与复旦大学白彤东教授的对话，探讨了工作尊严、社群主义局限性以及教育公平等议题，呼吁重建社会凝聚力与公共美德。\",\"date\":\"2025-03-20\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"优绩主义\",\"社会公平\",\"政治哲学\",\"劳动尊严\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/michael-sandel-pku-lecture-critique-of-meritocracy.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-a-28-year-old-steve-jobs-gives-a-talk-at-the-1983-international-design-conference-in-aspen\",\"sender\":\"Steve Jobs Archive\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"Steve Jobs Archive\",\"publishedAt\":\"$undefined\",\"subject\":\"1983 乔布斯阿斯彭设计大会演讲\",\"snippet\":\"背景介绍：1983年6月的一个阳光明媚的早晨，史蒂夫·乔布斯（Steve Jobs）在阿斯彭（Aspen）国际设计大会的巨大帐篷后面等待登台。此次大会的主题是“未来已不再是过去的样子（The Future Isn’t What It Used to Be）”。面对数百名设计师和设计爱好者，乔布斯发表了关于计算机未来的演讲。 内容核心：在近一个小时的时间里，乔布斯对个人电脑的未来做出了几个极具前瞻性的预测，且强调了这种趋势的必然性。\",\"date\":\"2025-03-18\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"计算机史\",\"产品设计\",\"数字技术\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/a-28-year-old-steve-jobs-gives-a-talk-at-the-1983-international-design-conference-in-aspen.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-ai-in-mathematics-and-physics-mike-douglas-ias-2025\",\"sender\":\"Michael Douglas\",\"author\":\"Michael Douglas\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Michael Douglas\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"人工智能在数学与物理学中的应用——Mike Douglas 于普林斯顿高等研究院的讲座\",\"snippet\":\"哈佛大学 Michael Douglas 在普林斯顿高等研究院发表讲座，系统回顾了人工智能在数学与理论物理领域的应用现状，包括辅助科学计算、数学数据科学、组合优化和交互式定理证明等成功范例。讲座提出了数学研究助理的愿景，探讨了自主数学研究的可能性，并预测未来两三年内AI将在数学研究中发挥重要作用，甚至可能达到或超越人类顶级研究人员的水平。\",\"date\":\"2025-03-17\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"人工智能\",\"数学研究\",\"理论物理\",\"定理证明\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/ai-in-mathematics-and-physics-mike-douglas-ias-2025.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-bill-gates-starting-the-digital-revolution\",\"sender\":\"布拉德·史密斯\",\"author\":\"布拉德·史密斯\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"布拉德·史密斯\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"比尔·盖茨——开启数字革命之旅\",\"snippet\":\"微软成立50周年之际，总裁布拉德·史密斯与联合创始人比尔·盖茨展开深度对话，回顾了盖茨从少年时期接触编程到创立微软的历程，探讨了让每张桌子和每个家庭都拥有一台计算机这一愿景的实现过程，并就人工智能的未来潜力、全球慈善事业及领导力经验进行了坦诚交流。\",\"date\":\"2025-03-13\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"微软\",\"计算机史\",\"人工智能\",\"公益慈善\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/bill-gates-starting-the-digital-revolution.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-ai-utopia-or-dystopia-cedric-villani\",\"sender\":\"Cédric Villani\",\"author\":\"Cédric Villani\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Cédric Villani\",\"塞德里克·维拉尼（Cédric Villani）\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"人工智能：乌托邦还是反乌托邦？\",\"snippet\":\"菲尔兹奖得主塞德里克·维拉尼以其独特的叙事风格，回顾人工智能从寒冬到盛夏的发展历程。从20世纪90年代算法与社会的初啼，到1997年卡斯帕罗夫对阵深蓝的史诗对决，再到2012年深度学习的复兴与2022年ChatGPT的横空出世，他带领听众穿越AI的历史长河，探讨技术进步背后的社会挑战、伦理困境与人类未来。\",\"date\":\"2025-03-02\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"人工智能\",\"深度学习\",\"AI治理\",\"科技伦理\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/ai-utopia-or-dystopia-cedric-villani.md\",\"coverImage\":\"$u defined\",\"publishedAt\":\"$undefined\",\"subject\":\"Anthropic：构建有效AI代理的技巧与见解\",\"snippet\":\"Anthropic团队成员Alex、Erik和Barry围绕AI Agent的定义、设计与实践展开深度访谈。他们区分了工作流与Agent两种模式，强调开发者应站在模型视角进行工具描述和提示工程。讨论涵盖编码Agent的可验证性优势、企业级应用前景，以及消费者Agent当前的局限性，并为开发者提供了从简单做起、注重结果衡量的实用建议。\",\"date\":\"2025-02-13\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"智能体\",\"开发工作流\",\"工具调用\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/anthropic-tips-for-building-effective-ai-agents.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-errol-musk-life-story-interview\",\"sender\":\"henri\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"埃罗尔·马斯克：埃隆·马斯克的父亲讲述其一生\",\"snippet\":\"本文为埃隆·马斯克之父埃罗尔·马斯克的深度访谈实录，涵盖其在种族隔离时期南非的成长经历、工程师与企业家生涯、多段婚姻与家庭关系，以及与埃隆从资助创业到因政治立场不同而疏远再到和解的复杂父子关系。访谈还涉及马斯克家族财富来源、祖母绿生意争议及埃隆早年展现的天赋与性格特征。\",\"date\":\"2025-02-13\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"家庭关系\",\"南非历史\",\"创业\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/errol-musk-life-story-interview.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-elon-musk-dubai-wgs-talk-doge-ai-3d-transport\",\"sender\":\"Elon Musk\",\"author\":\"Elon Musk\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Elon Musk\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"Elon Musk 在迪拜世界政府峰会上的演讲 — 关于 DOGE、新 AI 和3D交通计划\",\"snippet\":\"Elon Musk 在迪拜世界政府峰会上发表演讲，围绕政府效率改革、Grok 3 人工智能模型、Boring Company 地下交通项目以及美国外交政策转向等议题展开论述。他主张通过削减官僚机构和监管来提升政府效率，介绍了具备强大推理能力的 Grok 3，并宣布与迪拜合作的 Dubai Loop 地下交通项目。\",\"date\":\"2025-02-12\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"政府改革\",\"人工智能\",\"交通基础设施\",\"外交政策\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/elon-musk-dubai-wgs-talk-doge-ai-3d-transport.md\",\"coverImage\":\"$undefined\"},{\"i 隆·马斯克的对话\",\"snippet\":\"埃隆·马斯克在西点军校的访谈实录，围绕未来战争中的技术变革展开讨论。马斯克指出人工智能和无人机将主导未来战场，强调美国需加大无人机生产投入，并阐述了Starlink在战场通信中的关键作用。访谈还涉及Neuralink与人机协作、AI对齐问题、太空军事化趋势，以及技术领导者应具备深厚技术背景等观点。\",\"date\":\"2025-02-05\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"军事技术\",\"无人机\",\"人工智能\",\"卫星通信\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/future-warfare-technology-elon-musk-west-point.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-elon-musk-doge-team-interview\",\"sender\":\"Fox News\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"Fox News\",\"publishedAt\":\"$undefined\",\"subject\":\"马斯克与其DOGE团队访谈\",\"snippet\":\"这份访谈记录展示了马斯克领导的政府效率部（DOGE）团队如何致力于削减美国联邦政府的浪费与欺诈。团队设定了将赤字从2万亿削减至1万亿美元的目标，揭示了诸如近10亿美元的在线调查合同、沿用70年的纸质退休系统等惊人案例，并回应了外界对其工作方式的批评。\",\"date\":\"2025-02-03\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"政府改革\",\"财政政策\",\"公共问责\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/elon-musk-doge-team-interview.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-jensen-huang-future-of-ai-and-nvidia-innovation\",\"sender\":\"henri\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"黄仁勋：人工智能的未来与NVIDIA的创新之路\",\"snippet\":\"NVIDIA CEO黄仁勋与WWT CEO Jim Kavanaugh展开深度对话，回顾了从IBM System/360到GPU革命的计算发展历程，阐述NVIDIA如何在十年内将计算性能提升百万倍，并展望AI代理、主权AI、AI教育等前沿话题，描绘人工智能开启新工业革命的宏大图景。\",\"date\":\"2025-02-03\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"GPU\",\"智能体\",\"计算机史\",\"机器学习\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/jensen-huang-future-of-ai-and-nvidia-innovation.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-deepseek-china-ai-startup-rise-and-global-impact\",\"sender\":\"henri\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases 科学研究和数学教育。\",\"date\":\"2023-11-15\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"量化投资\",\"微分几何\",\"数学教育\",\"科研生涯\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/jim-simons-from-mathematician-to-quant-investment-legend.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-hironaka-lecture-2002-learning-and-survival\",\"sender\":\"やまぐち街なか大学\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"やまぐち街なか大学\",\"publishedAt\":\"$undefined\",\"subject\":\"广中平祐 2002 演讲：生存与学习\",\"snippet\":\"2002 年广中平祐演讲，围绕教育本质、动机与文化氛围展开，强调“点燃求知火种”而非灌输。\",\"date\":\"2023-06-23\",\"isRead\":true,\"isStarred\":true,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"教育\",\"学习动机\",\"科研生涯\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/hironaka-lecture-2002-learning-and-survival.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-hironaka-talk-burning-dream-2003\",\"sender\":\"やまぐち街なか大学\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"やまぐち街なか大学\",\"publishedAt\":\"$undefined\",\"subject\":\"广中平祐 2003 演讲：严冬中燃烧的梦\",\"snippet\":\"2003 年广中平祐在山口大学演讲，讨论日本社会速度分化、教育动机与地方大学协作等中长期议题。\",\"date\":\"2023-06-23\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"教育\",\"学习动机\",\"大学发展\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/hironaka-talk-burning-dream-2003.md\",\"coverImage\":\"$undefined\"},{\"id\":\"indistractable-habits-and-adhd\",\"sender\":\"The Diary Of A CEO\",\"author\":\"henri\",\"sourceAuthor\":\"Nir Eyal（嘉宾）\",\"authorAliases\":[\"henri\",\"Nir Eyal（嘉宾）\",\"Nir Eyal\",\"Henri\",\"Hinbox\"],\"publisher\":\"The Diary Of A CEO\",\"publishedAt\":\"$undefined\",\"subject\":\"重新理解分心：真正的问题不是手机，而是我们逃避不适\",\"snippet\":\"这期访谈中，行为设计专家尼尔·埃亚尔围绕分心、拖延、习惯、意志力、职业倦怠和 ADHD 展开讨论。他的核心判断是，分心多数不是外部工具造成的，而是人们在逃避无聊、焦虑、孤独、压力等内在不适。想变得专注，关键不是粗暴戒断手机或社交媒体，而是识别内在触发因素，安排时间做真正重要的事，管理外部提示，并用承诺机制保护自己的注意力。\",\"date\":\"2023-05-22\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Notes\"],\"tags\":[\"注意力\",\"行为设计\",\"自我管理\",\"心理健康\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"notes/indistractable-habits-and-adhd.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-dennis-sullivan-abel-prize-interview-2022\",\"sender\":\"Dennis Sullivan, Christian Skau, Bjørn Ian Dundas\",\"author\":\"Dennis Sullivan, Christian Skau, Bjørn Ian Dundas\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Dennis Sullivan, Christian Skau, Bjørn Ian Dundas\",\"Dennis Sullivan\",\"Christian Skau\",\"Bjørn Ian Dundas\",\"丹尼斯·沙利文（Dennis Sullivan）、克里斯蒂安·斯考（Christian Skau）、比约恩·伊恩·邓达斯（Bjørn Ian Dundas）\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"丹尼斯·沙利文：从流形的外部走向内部\",\"snippet\":\"2022 年阿贝尔奖访谈：丹尼斯·沙利文从流形分类、手术理论和伽罗瓦作用谈到有理同伦、动力系统、费根鲍姆普适性与流体力学，回顾那些令整套理论豁然贯通的时刻，并阐述以简单结构理解数学的研究哲学。\",\"date\":\"2023-05-22\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"拓扑学\",\"动力系统\",\"流体力学\",\"数学研究\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/dennis-sullivan-abel-prize-interview-2022.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-how-to-read-better\",\"sender\":\"henri\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"如何读得更好\",\"snippet\":\"本文面向希望深入研究经典与非虚构类书籍的读者，提出将阅读比作锻炼的核心理念。作者建议循序渐进地培养阅读能力，采用两遍阅读法——先快速粗读把握全貌，再慢读深入理解细节。同时提倡轻注释与有意识的笔记方式，避免过度标记。此外还强调有目的地选书和随身携带书籍的习惯，旨在帮助读者追求阅读的质量与深度而非数量。\",\"date\":\"2023-03-25\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"阅读方法\",\"知识管理\",\"学习方法\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/how-to-read-better.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-ilya-sutskever-gpt4-future-of-ai\",\"sender\":\"Craig Smith\",\"author\":\"Craig Smith\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Craig Smith\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"AI大师Ilya Sutskever谈GPT-4与AI的未来\",\"snippet\":\"Eye on AI主持人Craig Smith与OpenAI联合创始人兼首席科学家Ilya Sutskever的深度对话。Sutskever回顾了从与Geoffrey Hinton合作研究神经网络到推动AlexNet突破再到领导GPT系列模型演进的历程，探讨了大型语言模型的能力与局限、RLHF对齐方法、多模态学习的必要性，以及AI规模化发展对社会的深远影响。\",\"date\":\"2023-03-15\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"大语言模型\",\"深度学习\",\"模型训练\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/ilya-sutskever-gpt4-future-of-ai.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-dirac-interview-by-hund-1982-symmetry-physics\",\"sender\":\"弗里德里希·洪德\",\"author\":\"弗里德里希·洪德\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"弗里德里希·洪德\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"保罗·狄拉克访谈——对称性在理论物理学中的核心地位（1982）\",\"snippet\":\"1982年弗里德里希·洪德对诺贝尔物理学奖得主狄拉克的访谈。狄拉克回顾了对称性在理论物理学中的核心地位，从爱因斯坦狭义相对论的时空对称性出发，谈及狄拉克方程中自旋的自然涌现、负能量态与反物质的发现、广义相对论的局限与前景，以及精细结构常数等未解之谜，展现了二十世纪物理学的深层脉络。\",\"date\":\"2023-02-17\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"对称性\",\"相对论\",\"量子力学\",\"宇宙学\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/dirac-interview-by-hund-1982-symmetry-physics.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-how-to-journal-like-a-stoic\",\"sender\":\"Jared Henderson\",\"author\":\"Jared Henderson\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Jared Henderson\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"如何像斯多葛派一样写日记\",\"snippet\":\"本文以马库斯·奥勒留的《沉思录》为灵感，探讨如何像斯多葛派哲学家一样进行每日日记写作。作者强调日记应当是私密的个人反思工具，无需昂贵的文具或应用，只需一张纸和一支铅笔即可开始。核心在于通过持续的写作习惯培养深度思考能力，与伟大思想家进行精神对话，最终实现自我提升与内心平和。\",\"date\":\"2022-12-15\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"斯多葛主义\",\"写作\",\"自我反思\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/how-to-journal-like-a-stoic.md\",\"coverImage\":\"$undefined\"},{\"id\":\"essays-june-huh-high-school-dropout-wins-the-fields-medal\",\"sender\":\"Jordana Cepelewicz\",\"author\":\"Jordana Cepelewicz\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Jordana Cepelewicz\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"高中辍学生许埈珥，斩获菲尔兹奖\",\"snippet\":\"许埈珥从大学第六年的偶然邂逅起步，以连接组合数学与几何的深刻洞察赢得数学界最高荣誉\",\"date\":\"2022-07-05\",\"isRead\":true,\"isStarred\":true,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Essays\"],\"tags\":[\"组合数学\",\"代数几何\",\"科研生涯\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"essays/june-huh-high-school-dropout-wins-the-fields-medal.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-william-dunham-a-tribute-to-euler\",\"sender\":\"Clay Mathematics Institute\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"Clay Mathematics Institute\",\"publishedAt\":\"$undefined\",\"subject\":\"讲座译稿：莱昂哈德·欧拉的生平与数学成就\",\"snippet\":\"CMI公开讲座。Bill Dunham教授详细梳理了历史上最伟大的数学家之一莱昂哈德·欧拉的生平事迹与令人惊叹的数学成就。\",\"date\":\"2022-04-05\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"数学史\",\"数学研究\",\"科学传播\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/william-dunham-a-tribute-to-euler.md\",\"coverImage\":\"$undefined\"},{\"id\":\"how-to-detach-from-overthinking-and-anxiety\",\"sender\":\"The Diary Of A CEO\",\"author\":\"henri\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"henri\",\"Henri\",\"Hinbox\"],\"publisher\":\"The Diary Of A CEO\",\"publishedAt\":\"$undefined\",\"subject\":\"焦虑不是敌人，关键是学会和情绪合作\",\"snippet\":\"这期访谈围绕过度思考、焦虑、拒绝、自尊、倦怠、睡眠、呼吸和关系模式展开。Julie Smith 的核心观点很直接：情绪不是坏东西，问题在于我们如何解释它、逃避它，或被它推着做决定。真正有效的改变，往往不是追求完美，而是识别模式、降低负荷、照顾身体，并在痛苦中重新获得选择权。\",\"date\":\"2022-03-03\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Notes\"],\"tags\":[\"心理健康\",\"情绪调节\",\"人际关系\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"notes/how-to-detach-from-overthinking-and-anxiety.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-chomsky-foucault-debate-on-human-nature\",\"sender\":\"henri\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"关于人性的辩论：诺姆·乔姆斯基与米歇尔·福柯\",\"snippet\":\"1971年为荷兰电视台录制的经典哲学辩论，乔姆斯基从语言学角度论证人类天赋结构与创造力的核心地位，福柯则从知识考古学出发质疑人性概念的科学有效性，认为文化中的认识论场域和无意识规则体系才是决定思想与行为的关键力量。两位思想家围绕主体性、创造力与结构展开深入交锋。\",\"date\":\"2022-02-08\",\"isRead\":true,\"isStarred\":true,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"人性\",\"语言学\",\"政治哲学\",\"权力\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/chomsky-foucault-debate-on-human-nature.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-donald-knuth-programming-algorithms-hard-problems-the-game-of-life-lex-fridman-podcast-219\",\"sender\":\"Lex Fridman\",\"author\":\"Lex Fridman\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Lex Fridman\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"高德纳谈编程、算法、难题与生命游戏\",\"snippet\":\"Lex Fridman对高德纳的第二次深度访谈。从1957年第一个程序聊起，深入探讨文学编程、代码中的幽默与美感，以及对当下人工智能和过度自动化的深层隐忧。\",\"date\":\"2021-09-10\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"算法\",\"文学编程\",\"人工智能\",\"自动化\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/donald-knuth-programming-algorithms-hard-problems-the-game-of-life-lex-fridman-podcast-219.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-from-the-60-minutes-archive-steve-jobs\",\"sender\":\"60 Minutes\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"60 Minutes\",\"publishedAt\":\"$undefined\",\"subject\":\"《60 分钟》档案：史蒂夫·乔布斯\",\"snippet\":\"苹果成立 45 周年之际，回顾 2011 年乔布斯逝世后数周播出的经典人物专访——传记作家艾萨克森 40 多次独家访谈揭示乔布斯一生的复杂人性\",\"date\":\"2021-04-02\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"苹果\",\"企业管理\",\"人生经历\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/from-the-60-minutes-archive-steve-jobs.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-renaissance-technologies-trading-strategies-revealed\",\"sender\":\"henri\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"文艺复兴科技公司交易策略揭秘\",\"snippet\":\"本文详细介绍了文艺复兴科技公司的发展历程及其核心交易策略。创始人詹姆斯·西蒙斯从数学家转型为对冲基金经理，带领团队先后开发了均值回归模型、核方法机器学习模型和短期交易策略，将奖章基金打造为史上最成功的对冲基金，自1988年以来费前年均回报率达66%。\",\"date\":\"2020-12-09\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"量化投资\",\"机器学习\",\"对冲基金\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/renaissance-technologies-trading-strategies-revealed.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-paul-dirac-taciturn-genius-against-mainstream\",\"sender\":\"henri\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"保罗·狄拉克 - 反对主流的沉默天才\",\"snippet\":\"本文深入探讨物理学巨匠保罗·狄拉克的科学贡献与思想历程。他在23岁时统一了海森堡与薛定谔的量子力学理论，提出了预测电子自旋和反物质的狄拉克方程，并对主流物理学的重整化方法提出尖锐批判。晚年他转向宇宙学研究，提出大数假说，试图揭示微观物理常数与宏观宇宙尺度之间的深刻联系，展现了他追求简洁与深刻的独特研究范式。\",\"date\":\"2020-11-30\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"量子力学\",\"狄拉克方程\",\"重整化\",\"科学史\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/paul-dirac-taciturn-genius-against-mainstream.md\",\"coverImage\":\"$undefined\"},{\"id\":\"essays-theyre-made-out-of-meat-terry-bisson-of-the-universe\",\"sender\":\"henri\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"他们是用肉做的\",\"snippet\":\"在这篇经典的科幻微小说中，特里·比森以极具颠覆性的视角，重新审视了人类引以为傲的智慧与意识。故事通过两名外星生物的对话展开，当他们发现地球人竟是纯粹的“肉”时，陷入了巨大的认知错位。“会思考的肉”“有爱的肉”，这些荒诞的表述直指一个深刻的命题：我们习以为常的生命形态，在宏大的宇宙尺度下可能显得何等怪异。文章不仅是一则关于星际接触的黑色幽默，更是一次对意识物质基础的冷峻追问。\",\"date\":\"2020-08-29\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Essays\"],\"tags\":[\"意识\",\"科幻\",\"生命科学\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"essays/theyre-made-out-of-meat-terry-bisson-of-the-universe.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-donald-knuth-algorithms-complexity-and-the-art-of-computer-programming-lex-fridman-podcast-62\",\"sender\":\"Lex Fridman\",\"author\":\"Lex Fridman\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Lex Fridman\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"高德纳谈算法、复杂性与《计算机程序设计艺术》\",\"snippet\":\"Lex Fridman采访图灵奖得主高德纳，探讨他与IBM 650的结缘、极客思维、图灵影响、文学编程理念、《计算机程序设计艺术》的创作历程、算法本质、P与NP问题、人工智能局限，以及宗教、生命哲学和对TeX排版系统中美的极致追求。\",\"date\":\"2019-12-31\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"算法\",\"计算复杂性\",\"文学编程\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/donald-knuth-algorithms-complexity-and-the-art-of-computer-programming-lex-fridman-podcast-62.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-jean-pierre-serre-abel-prize-interview-2003\",\"sender\":\"Jean-Pierre Serre\",\"author\":\"Jean-Pierre Serre\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Jean-Pierre Serre\",\"让-皮埃尔·塞尔（Jean-Pierre Serre）\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"塞尔访谈：数学的统一、证明与发现\",\"snippet\":\"首届阿贝尔奖得主塞尔回顾代数拓扑、数论与群论研究，谈数学直觉、证明的可靠性、重大猜想、青年数学家的成长，以及数学之外的生活。\",\"date\":\"2019-12-10\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"代数拓扑\",\"数论\",\"群论\",\"数学证明\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/jean-pierre-serre-abel-prize-interview-2003.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-john-milnor-abel-prize-interview-2011\",\"sender\":\"John Milnor, Martin Raussen, Christian Skau\",\"author\":\"John Milnor, Martin Raussen, Christian Skau\",\"sourceAuthor\":\"$undefined\",\"autho es/latex-vim-note-taking.md\",\"coverImage\":\"$undefined\"},{\"id\":\"essays-bitter-lesson\",\"sender\":\"Richard Sutton\",\"author\":\"Richard Sutton\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Richard Sutton\",\"Richard Sutton（里奇·萨顿）\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"苦涩的教训\",\"snippet\":\"\",\"date\":\"2019-03-13\",\"isRead\":true,\"isStarred\":true,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Essays\"],\"tags\":[\"机器学习\",\"计算规模\",\"强化学习\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"essays/bitter-lesson.md\",\"coverImage\":\"$undefined\"},{\"id\":\"essays-the-friendship-that-built-google\",\"sender\":\"James Somers\",\"author\":\"James Somers\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"James Somers\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"缔造谷歌庞大帝国的友谊\",\"snippet\":\"本文讲述了谷歌两位顶尖工程师Jeff Dean和Sanjay Ghemawat长达数十年的合作友谊。他们通过在同一台电脑前共同编程的独特方式，解决了谷歌早期面临的索引崩溃、硬件故障和系统扩展等关键难题，重写了公司核心基础设施，推动谷歌从一家初创公司成长为互联网巨头。两人是谷歌仅有的十一级高级院士，被誉为公司一个大脑的两半。\",\"date\":\"2018-12-03\",\"isRead\":true,\"isStarred\":true,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Essays\"],\"tags\":[\"分布式系统\",\"结对编程\",\"软件工程\",\"谷歌\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"essays/the-friendship-that-built-google.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-gilbert-strang-interview-juliacon-2018\",\"sender\":\"Alan Edelman\",\"author\":\"Alan Edelman\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Alan Edelman\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"Gilbert Strang访谈JuliaCon2018\",\"snippet\":\"2018年JuliaCon大会上，MIT教授Alan Edelman与传奇数学家Gilbert Strang进行了一场炉边谈话。访谈围绕线性代数在计算与数据科学中的核心地位展开，涵盖Strang新书《线性代数与从数据中学习》的内容介绍、张量与随机线性代数等新兴主题、机器学习中的优化挑战、数据驱动与物理建模的交叉融合，以及在线教育的深远影响。\",\"date\":\"2018-08-10\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"线性代数\",\"数据科学\",\"深度学习\",\"数学教育\",\"Julia\"],\"mdTheme\":\"magazine d.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-andrew-wiles-abel-prize-interview-2016\",\"sender\":\"Andrew Wiles, Martin Raussen, Christian Skau\",\"author\":\"Andrew Wiles, Martin Raussen, Christian Skau\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Andrew Wiles, Martin Raussen, Christian Skau\",\"Andrew Wiles\",\"Martin Raussen\",\"Christian Skau\",\"安德鲁·怀尔斯（Andrew Wiles）、马丁·劳森（Martin Raussen）、克里斯蒂安·斯考（Christian Skau）\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"安德鲁·怀尔斯访谈：费马大定理、模性与数学直觉\",\"snippet\":\"安德鲁·怀尔斯回顾费马大定理从无穷递降法到模性猜想的历史，解释椭圆曲线、塞尔默群与 BSD 猜想，并谈七年独立研究、证明缺口、数学直觉和好问题的力量。\",\"date\":\"2016-05-23\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"费马大定理\",\"数论\",\"椭圆曲线\",\"数学研究\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/andrew-wiles-abel-prize-interview-2016.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-emacs-for-writers\",\"sender\":\"Jay Dixit\",\"author\":\"Jay Dixit\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Jay Dixit\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"Emacs for Writers\",\"snippet\":\"科学作家Jay Dixit分享了他作为非程序员如何将Emacs打造为理想写作环境的历程。他在撰写复杂非虚构书籍时发现Microsoft Word和Scrivener无法满足结构组织需求，转而学习Emacs Org mode，实现了键盘驱动的大纲编辑、内容管理、多格式导出等功能，并介绍了缩写模式、集成搜索、版本控制等提升写作与研究效率的实践技巧。\",\"date\":\"2016-04-27\",\"isRead\":true,\"isStarred\":true,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"Emacs\",\"Org Mode\",\"写作\",\"知识管理\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/emacs-for-writers.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-getting-started-with-org-mode\",\"sender\":\"Harry Schwarz\",\"author\":\"Harry Schwarz\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Harry Schwarz\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"Org Mode入门\",\"snippet\":\"本文是 thoughtbot 开发者 Harry Schwarz 关于 Emacs Org Mode 的入门讲座实录。内容涵盖 Org Mode 的大纲编辑、标记语法、表格处理、导出功能、代码块执行与文学编程、LaTeX 数学公式支持，以及基于 TODO 和 Agenda 的任务管理体系，全面展示了 Org Mode 作为纯文本生产力工具的强大能力。\",\"date\":\"2016-04-27\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"Emacs\",\"Org Mode\",\"文学编程\",\"任务管理\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/getting-started-with-org-mode.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-how-to-have-a-bad-career-david-patterson-talks-at-google\",\"sender\":\"Talks at Google\",\"author\":\"$undefined\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[],\"publisher\":\"Talks at Google\",\"publishedAt\":\"$undefined\",\"subject\":\"如何拥有一段糟糕的职业生涯\",\"snippet\":\"本文整理图灵奖得主 David Patterson 的职业发展演讲，以“反面清单”方式总结学术与工程成长中的常见陷阱。\",\"date\":\"2016-01-28\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"职业发展\",\"科研生涯\",\"软件工程\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/how-to-have-a-bad-career-david-patterson-talks-at-google.md\",\"coverImage\":\"$undefined\"},{\"id\":\"essays-will-computers-redefine-the-roots-of-math\",\"sender\":\"Kevin Hartnett\",\"author\":\"Kevin Hartnett\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Kevin Hartnett\",\"凯文·哈特内特 (Kevin Hartnett)\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"计算机将重新定义数学的根基吗\",\"snippet\":\"菲尔兹奖得主沃埃沃德斯基在自己的论文中发现错误后，开始推动用计算机证明助手来验证数学证明的正确性。为此他发展了单值基础理论，试图用类型论和无穷广群取代传统集合论，从根本上重塑数学的形式化基础，使数学语言与计算机编程语言更紧密地结合。\",\"date\":\"2015-05-19\",\"isRead\":true,\"isStarred\":true,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Essays\"],\"tags\":[\"数学基础\",\"类型论\",\"证明助手\",\"同伦类型论\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"essays/will-computers-redefine-the-roots-of-math.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-john-nash-abel-prize-interview-2015\",\"sender\":\"John Nash, Martin Raussen, Christian Skau\",\"author\":\"John Nash, Martin Raussen, Christian Skau\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"John Nash, Martin Raussen, Christian Skau\",\"John Nash\",\"Martin Raussen\",\"Christian Skau\",\"约翰·纳什（John Nash）、马丁·劳森（Martin Raussen）、克里斯蒂安·斯考（Christian Skau）\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"约翰·纳什：从博弈均衡到几何嵌入\",\"snippet\":\"约翰·纳什在 2015 年阿贝尔奖访谈中回顾博弈均衡、实代数流形与等距嵌入的研究，谈与冯·诺依曼、爱因斯坦的会面，以及独立思考、数学难题和原创性的关系。\",\"date\":\"2015-05-18\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"博弈论\",\"几何\",\"数学研究\",\"数学证明\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/john-nash-abel-prize-interview-2015.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-steve-jobs-most-innovative-speech\",\"sender\":\"Steve Jobs\",\"author\":\"Steve Jobs\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Steve Jobs\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"史蒂夫·乔布斯：回归苹果的转折点与斯坦福演讲\",\"snippet\":\"本文整理乔布斯两段代表性演讲，涉及苹果战略重建与个人成长叙事。\",\"date\":\"2015-05-17\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"苹果\",\"企业战略\",\"人生经历\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/steve-jobs-most-innovative-speech.md\",\"coverImage\":\"$undefined\"},{\"id\":\"function-colors-and-async-programming\",\"sender\":\"henri\",\"author\":\"henri\",\"sourceAuthor\":\"Bob Nystrom\",\"authorAliases\":[\"henri\",\"Bob Nystrom\",\"Henri\",\"Hinbox\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"异步函数为什么会污染代码结构\",\"snippet\":\"这篇文章用红色函数和蓝色函数的比喻，解释异步编程为什么会让代码世界分裂成两套规则。回调、Promise、async await 都在缓解痛苦，但没有完全消除同步与异步之间的边界。真正的问题在于调用栈如何保存与恢复，而线程、协程、goroutine 这类机制能从根上减少这种割裂。\",\"date\":\"2015-02-01\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Notes\"],\"tags\":[\"异步编程\",\"编程语言\",\"软件架构\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"notes/function-colors-and-async-programming.md\",\"coverImage\":\"$undefined\"},{\"id\":\"walking-and-creativity\",\"sender\":\"American Psychological Association\",\"author\":\"henri\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"henri\",\"Henri\",\"Hinbox\"],\"publisher\":\"American Psychological Association\",\"publishedAt\":\"$undefined\",\"subject\":\"走路为什么会让人更有创意\",\"snippet\":\"走路可能短暂提升人的创造性思维，尤其适合需要发散想法、寻找替代用途、生成新类比的任务。研究团队通过多组实验比较坐着、室内跑步机行走、户外行走以及坐轮椅户外移动等情境，发现行走者更容易产生新颖且合适的答案。不过，面对只有一个正确答案的集中型问题时，走路并不占优，甚至略微落后于坐着完成任务的人。\",\"date\":\"2014-04-24\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Notes\"],\"tags\":[\"创造力\",\"运动健康\",\"认知科学\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"notes/walking-and-creativity.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-jim-simons-lecture-mit-2010-mathematics-common-sense-good-luck\",\"sender\":\"Jim Simons\",\"author\":\"Jim Simons\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Jim Simons\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"讲座-吉姆·西蒙斯@MIT2010｜我的生活与工作 - 数学、常识、好运\",\"snippet\":\"2010年MIT特别讲座记录。传奇数学家、投资家吉姆·西蒙斯分享了从MIT求学到创立文艺复兴科技公司的心路历程，涵盖数学研究、职业转型、量化对冲基金的成功秘诀，以及西蒙斯基金会在基础科学和数学教育领域的慈善实践。由著名数学家Isadore Singer引荐并回顾两人的学术渊源。\",\"date\":\"2013-05-24\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"量化投资\",\"数学研究\",\"公益慈善\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/jim-simons-lecture-mit-2010-mathematics-common-sense-good-luck.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-steve-jobs-in-2003-at-d1-the-first-d-all-things-digital-conference-enhanced-quality\",\"sender\":\"z400racer37\",\"author\":\"z400racer37\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"z400racer37\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"2003 年首届 D 大会：乔布斯谈数字枢纽战略与 iTunes 音乐商店\",\"snippet\":\"2003 年首届 D: All Things Digital 大会上乔布斯专访：阐述 PC 作为数字枢纽的第三次浪潮、现场演示仅发布三周的 iTunes 音乐商店，以及关于平板电脑和手机的战略性回答\",\"date\":\"2012-06-02\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"苹果\",\"数字音乐\",\"产品设计\",\"计算机史\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/steve-jobs-in-2003-at-d1-the-first-d-all-things-digital-conference-enhanced-quality.md\",\"coverImage\":\"$undefined\"},{\"id\":\"essays-no-death-no-taxes-peter-thiel-libertarian-future\",\"sender\":\"乔治·帕克\",\"author\":\"乔治·帕克\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"乔治·帕克\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"无死无税——彼得·蒂尔的自由意志主义未来观\",\"snippet\":\"本文是《纽约客》对硅谷亿万富翁彼得·蒂尔的深度人物特写。蒂尔从PayPal联合创始人成长为顶级科技投资者，却对信息时代的实际成就深感失望，认为科技进步陷入停滞。作为坚定的自由意志主义者，他将投资转向生命延长、海上家园和人工智能等激进领域，试图突破人类的生物学与社会政治局限，同时批判传统教育体系对创新精神的压制。\",\"date\":\"2011-11-20\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Essays\"],\"tags\":[\"自由意志主义\",\"风险投资\",\"科技发展\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"essays/no-death-no-taxes-peter-thiel-libertarian-future.md\",\"coverImage\":\"$undefined\"},{\"id\":\"talks-macworld-1997-the-return-of-steve-jobs\",\"sender\":\"JC\",\"author\":\"JC\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"JC\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"Macworld 1997：史蒂夫·乔布斯的回归\",\"snippet\":\"本文回顾 1997 年乔布斯重返 Macworld 舞台的关键演讲，覆盖苹果危机判断、治理调整与微软合作框架。\",\"date\":\"2011-10-20\",\"isRead\":true,\"isStarred\":false,\"hasAttachment\":false,\"labels\":[\"Inbox\",\"Talks\"],\"tags\":[\"苹果\",\"企业治理\",\"企业战略\"],\"mdTheme\":\"magazine\",\"sourcePath\":\"talks/macworld-1997-the-return-of-steve-jobs.md\",\"coverImage\":\"$undefined\"},{\"id\":\"essays-why-i-write\",\"sender\":\"Eric Blair\",\"author\":\"Eric Blair\",\"sourceAuthor\":\"$undefined\",\"authorAliases\":[\"Eric Blair\"],\"publisher\":\"$undefined\",\"publishedAt\":\"$undefined\",\"subject\":\"我为何写作\",\"snippet\":\"乔治·奥威尔（本名埃里克·布莱尔）的《我为何写作》是一篇关于创作本源的经典自白。在这篇写于1946年的散文中，奥威尔回溯了自己的文学生涯起点——从五六岁立志成为作家，到少年时期孤独的内心世界和文字练习，再到十六岁时发现词语本身的魅力。他最终提炼出支撑一切写作行为的四种动机：纯粹的自私自利、审美热情、历史冲动与政治目的。值得注意的是，奥威尔坦诚这四者相互竞争，比重因人因时而异，而他本人的天性更偏向前三者，是时代将他推向了政治写作的道路。文\",\"d
